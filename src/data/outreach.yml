- slug: smartmap-educacao
  name: SmartMap Educação
  kind:
    pt: Startup — inteligência territorial para a educação municipal
    en: Startup — territorial intelligence for municipal education
  status:
    pt: Protótipo funcional em modo de demonstração com dados públicos; concorrendo ao Programa Centelha
    en: Working prototype in demonstration mode with public data; competing in the Centelha programme
  summary:
    pt: Startup fundada em Alagoas. Plataforma de apoio à decisão para secretarias municipais de educação, que organiza dados públicos (matrículas, IDEB, orçamento) em mapas, indicadores e simuladores. O modo de demonstração usa dados abertos do município de Penedo.
    en: Startup founded in Alagoas. Decision-support platform for municipal education departments that organises public data (enrolment, IDEB, budget) into maps, indicators and simulators. The demonstration mode uses open data from the municipality of Penedo.
  role:
    pt: Fundador, coordenação técnica e desenvolvimento
    en: Founder, technical coordination and development
  links:
    - label: smartmap-educacao.vercel.app
      url: https://smartmap-educacao.vercel.app/
  tracks: [economia-politicas-publicas, ia-governo-digital-seguranca]

