- slug: patacidada
  name: PataCidadã
  kind:
    pt: Startup — plataforma gratuita de proteção animal
    en: Startup — free animal-protection platform
  status:
    pt: Em fase final de aprimoramento para lançamento
    en: Final refinement phase before launch
  summary:
    pt: Startup fundada em Alagoas. Plataforma gratuita de proteção animal que reúne registro de animais perdidos e encontrados, canais de denúncia, resgates, adoção e um perfil público para organizações de proteção animal, com um painel de indicadores para a gestão pública.
    en: Startup founded in Alagoas. Free animal-protection platform that brings together lost-and-found reports, reporting channels, rescues, adoption and a public profile for animal-protection organisations, with an indicator dashboard for public management.
  role:
    pt: Fundador, desenho do produto e desenvolvimento
    en: Founder, product design and development
