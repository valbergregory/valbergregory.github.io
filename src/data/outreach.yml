- slug: patacidada
  name: PataCidadã
  kind:
    pt: Plataforma de proteção animal
    en: Animal-protection platform
  status:
    pt: Em fase final de aprimoramento para lançamento
    en: Final refinement phase before launch
  summary:
    pt: Plataforma gratuita de proteção animal criada em Alagoas. Reúne registro de animais perdidos e encontrados, canais de denúncia, resgates, adoção e um perfil público para organizações de proteção animal, com um painel de indicadores para a gestão pública.
    en: Free animal-protection platform created in Alagoas. It brings together lost-and-found reports, reporting channels, rescues, adoption and a public profile for animal-protection organisations, with an indicator dashboard for public management.
  role:
    pt: Fundador, desenho do produto e desenvolvimento
    en: Founder, product design and development
  links:
    - label: patacidada.com.br
      url: https://patacidada.com.br/
    - label: app.patacidada.com.br
      url: https://app.patacidada.com.br/
  tracks: [ia-governo-digital-seguranca]

- slug: smartmap-educacao
  name: SmartMap Educação
  kind:
    pt: Inteligência territorial para a educação municipal
    en: Territorial intelligence for municipal education
  status:
    pt: Protótipo funcional em modo de demonstração com dados públicos
    en: Working prototype in demonstration mode with public data
  summary:
    pt: Plataforma de apoio à decisão para secretarias municipais de educação, que organiza dados públicos (matrículas, IDEB, orçamento) em mapas, indicadores e simuladores. O modo de demonstração usa dados abertos do município de Penedo.
    en: Decision-support platform for municipal education departments that organises public data (enrolment, IDEB, budget) into maps, indicators and simulators. The demonstration mode uses open data from the municipality of Penedo.
  role:
    pt: Coordenação técnica e desenvolvimento
    en: Technical coordination and development
  links:
    - label: smartmap-educacao.vercel.app
      url: https://smartmap-educacao.vercel.app/
  tracks: [economia-politicas-publicas, ia-governo-digital-seguranca]

- slug: observatorio-digitalizacao-portuaria
