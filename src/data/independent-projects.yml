    en: Working prototype in a demonstration environment; no public release
  summary:
    pt: Plataforma que ajuda o cidadão e o microempreendedor a estruturar uma demanda nos casos em que a lei dispensa advogado (Juizados Especiais), com motor jurídico determinístico e versionado, documentos com verificação de integridade, guias de custas e acessibilidade (WCAG 2.2 AA, modo totem).
