    en: Legaltech — judgment liquidation (in development)
  status:
    pt: Em desenvolvimento; sem versão pública
    en: In development; no public release
  summary:
    pt: Sistema para liquidação de sentenças judiciais que lê os autos em PDF, extrai os comandos condenatórios com revisão humana obrigatória e calcula os valores com um motor determinístico baseado em índices oficiais, produzindo memória de cálculo auditável, com trilha de revisão e tratamento de dados pessoais conforme a LGPD.
    en: System for liquidating court judgments that reads case files in PDF, extracts the operative provisions with mandatory human review and computes amounts with a deterministic engine based on official indices, producing an auditable calculation memory with a review trail and LGPD-compliant handling of personal data.
