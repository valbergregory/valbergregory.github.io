# Projetos independentes ou AINDA NÃO CLASSIFICADOS (migrados de outreach.yml em 13/09/2026).
#
# Regras (src/content.config.ts › projectSchema):
# - `nature: independent` só pode ser usado com ipStatus, relationshipToUfal/Tjal e
#   resourcesUsed preenchidos com valores definitivos e evidencePublic não vazio;
# - `nature: institutional-*` exige institutionalRegistration (publicId, issuer, date);
# - enquanto faltarem provas, use under-review / unknown. A interface renderiza
#   "classificação institucional em revisão" e NUNCA a declaração de independência.
# - Apresentação sem preços, projeções comerciais ou convite a propostas pelo e-mail
#   institucional. Só entram informações públicas.
#
# Pendências correspondentes: src/data/legal-review-needed.yml (natureza-juridica-projetos,
# recursos-institucionais-projetos, titularidade-pi-projetos, relacao-tjal-legaltechs).

