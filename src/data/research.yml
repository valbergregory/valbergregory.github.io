      - Tabela OWASP LLM Top 10 × Judiciário e diagnóstico LGPD × Resoluções CNJ × ISO/NIST
    en:
      - Open replication data (matrix of the 27 courts)
      - OWASP LLM Top 10 × Judiciary table and LGPD × CNJ resolutions × ISO/NIST diagnostic
