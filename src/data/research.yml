- slug: tourism-gravity-brazil
  title: 'Distance, Connectivity, and Price Competitiveness: A Gravity-Based Analysis of International Tourism Demand for Brazil'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-turismo
  status: pre-submissao
  summary:
    pt: Qual é o papel da distância, da conectividade aérea e da competitividade de preços na demanda internacional de turismo para o Brasil? Painel mensal de 2000 a 2025 com 87 origens e modelos gravitacionais estimados por PPML.
    en: What is the role of distance, air connectivity and price competitiveness in international tourism demand for Brazil? Monthly panel from 2000 to 2025 with 87 origin countries and gravity models estimated by PPML.
  researchQuestion:
    pt: Qual é o papel da distância, da conectividade aérea e da competitividade de preços na demanda internacional de turismo para o Brasil?
    en: What is the role of distance, air connectivity and price competitiveness in international tourism demand for Brazil?
  motivation:
    pt: 'O interesse pela área foi fortalecido ao trabalhar temas de Turismo nas aulas de graduação em Penedo. A pergunta prática é simples — o que mais pesa na chegada de turistas estrangeiros: estar longe, ter poucos voos ou ser caro? — e a resposta orienta promoção internacional e política aérea.'
    en: Interest in the topic grew while teaching Tourism-related subjects in undergraduate courses in Penedo. The practical question is simple - what weighs most on foreign arrivals - being far away, having few flights or being expensive? - and the answer guides international promotion and aviation policy.
  dataSources:
    pt:
      - Ministério do Turismo / Embratur — chegadas internacionais mensais por país de origem e via de acesso, 2000–2025
      - ANAC — Dados Estatísticos do Transporte Aéreo (voos, assentos, passageiros e indicador de voo direto por país-mês)
      - CEPII GeoDist — distâncias bilaterais, contiguidade, língua comum e vínculo colonial
      - Banco Mundial (WDI) — PIB per capita, população, CPI, câmbio e níveis de preços
    en:
      - Ministério do Turismo / Embratur — monthly international arrivals by origin country and access mode, 2000–2025
      - ANAC — Air Transport Statistics (flights, seats, passengers and direct-service indicator by country-month)
      - CEPII GeoDist — bilateral distances, contiguity, common language and colonial link
      - World Bank (WDI) — GDP per capita, population, CPI, exchange rate and price levels
  methods:
    pt:
      - Modelos gravitacionais estimados por PPML com efeitos fixos de origem e de mês
      - Especificações com efeitos aleatórios correlacionados (PPML-CRE) para distância, contiguidade, língua e vínculo colonial
      - 'Robustez: subamostras pré-pandemia e pós-reabertura, medidas alternativas de preço, painel balanceado, frequência trimestral, painel por via de acesso e exclusão de origens (leave-one-out)'
    en:
      - Gravity models estimated by PPML with origin and month fixed effects
      - Correlated-random-effects specifications (PPML-CRE) for distance, contiguity, language and colonial link
      - 'Robustness: pre-pandemic and post-reopening subsamples, alternative price measures, balanced panel, quarterly frequency, access-mode panel and leave-one-out exclusion of origins'
  methodTags: [gravitacional, ppml, painel, efeitos-fixos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Manuscrito em pré-submissão; os resultados serão divulgados após a avaliação por pares.
      - Os dados brutos não são redistribuídos; o pipeline os baixa das fontes oficiais. Os painéis processados estão no repositório.
      - Regimes de visto e a extensão de gravidade estrutural multidestino estão previstos no código, mas desativados.
    en:
      - Manuscript at the pre-submission stage; results will be released after peer review.
      - Raw data are not redistributed; the pipeline downloads them from the official sources. Processed panels are in the repository.
      - Visa regimes and the multi-destination structural-gravity extension are coded but switched off.
  implications:
    pt:
      - Promoção internacional, malha aérea, conectividade e competitividade.
      - Planejamento de destinos e políticas da Embratur.
    en:
      - International promotion, air network, connectivity and competitiveness.
      - Destination planning and Embratur policies.
  extensionProducts:
    pt:
      - Painéis de fluxo, mapas e boletins sobre a demanda turística
      - Aplicações para Penedo, Baixo São Francisco e Alagoas
    en:
      - Flow dashboards, maps and bulletins on tourism demand
      - Applications for Penedo, the Lower São Francisco and Alagoas
  repository: https://github.com/valbergregory/tourism-gravity-brazil
  repositoryVisibility: public
  languages: [R]
  outputTypes: [artigo, painel-publico, software]
