- slug: abusive-litigation-patterns
  title: 'Detecting Patterns of Abusive Litigation: An Explainable and Human-Centered Jurimetric Framework'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: É possível identificar padrões de litigância abusiva de forma explicável, auditável e compatível com supervisão humana e devido processo? O projeto analisa padrões processuais; não atribui culpa nem rotula pessoas automaticamente.
    en: Can patterns of abusive litigation be identified in an explainable, auditable way that is compatible with human oversight and due process? The project analyses procedural patterns; it does not assign blame or label people automatically.
  researchQuestion:
    pt: É possível identificar padrões de litigância abusiva de forma explicável, auditável e compatível com supervisão humana e devido processo?
    en: Can patterns of abusive litigation be identified in an explainable, auditable way that is compatible with human oversight and due process?
  motivation:
    pt: Litigância repetitiva e artificial consome recursos judiciais e prejudica quem tem demandas legítimas. Ferramentas de triagem existem, mas raramente são explicáveis ou auditáveis. O projeto propõe um arcabouço em que cada sinal é interpretável e a decisão permanece humana.
    en: Repetitive and artificial litigation consumes judicial resources and harms those with legitimate claims. Screening tools exist, but they are rarely explainable or auditable. The project proposes a framework in which every signal is interpretable and the decision remains human.
  dataSources:
    pt:
      - Íntegras das decisões terminativas e acórdãos do STJ publicados no DJe (texto integral, desde 2021) — Portal de Dados Abertos do STJ
      - Espelhos de acórdãos do STJ (ementa, jurisprudência citada e referências legislativas)
      - Acervo em tramitação e atas de distribuição do STJ, usados apenas como ponte entre o número de registro do STJ e o número CNJ (sem partes e advogados)
      - Trajetórias processuais (classe, assunto, órgão e movimentos) da API Pública do DataJud (CNJ), no STJ e no tribunal de origem
      - Recomendação CNJ 159/2024 (Anexo A), Resolução CNJ 615/2025 e Tabelas Processuais Unificadas do CNJ
    en:
      - Full text of STJ terminative decisions and judgments published in the DJe (from 2021) — STJ Open Data Portal
      - STJ espelhos de acórdãos (summaries, cited case law and legislative references)
      - STJ pending-case snapshot and distribution records, used only as the bridge between the STJ registry number and the CNJ case number (no parties or lawyers)
      - Procedural trajectories (class, subject, judging body and movements) from the CNJ DataJud public API, in the STJ and in the court of origin
      - CNJ Recommendation 159/2024 (Annex A), CNJ Resolution 615/2025 and the CNJ unified procedural tables
  methods:
    pt:
      - Léxico versionado (expressões regulares em camadas) aplicado ao texto integral, com precisão e revocação medidas contra um padrão-ouro anotado manualmente segundo protocolo publicado
      - Covariáveis de trajetória processual construídas a partir dos movimentos do DataJud, com grupo de comparação de casos não sinalizados
      - Aprendizado de máquina explicável com salvaguardas de revisão humana
    en:
      - Versioned lexicon (tiered regular expressions) applied to the full text, with precision and recall measured against a manually annotated gold set under a published protocol
      - Procedural-trajectory covariates built from DataJud movements, with a comparison group of unsignalled cases
      - Explainable machine learning with human-review safeguards
  methodTags: [ml-explicavel, text-mining]
  showPreliminaryFindings: false
  limitations:
    pt:
      - O padrão-ouro ainda está em anotação manual; nenhum modelo ou resultado existe.
      - A sinalização judicial mede o que o STJ escreveu, não o fenômeno; casos não sinalizados não são "legítimos", e só chega ao STJ o que foi recorrido.
      - Padrões estatísticos não equivalem a conduta ilícita; qualquer uso exige supervisão humana e devido processo.
    en:
      - The gold set is still being annotated by hand; no model or result exists.
      - Judicial signalling measures what the STJ wrote, not the phenomenon; unsignalled cases are not "legitimate", and only appealed cases reach the STJ.
      - Statistical patterns are not equivalent to unlawful conduct; any use requires human oversight and due process.
  implications:
    pt:
      - Critérios de transparência e auditabilidade para ferramentas de triagem judicial.
    en:
      - Transparency and auditability criteria for judicial screening tools.
  extensionProducts:
    pt:
      - Protocolo de anotação e documentação pública do arcabouço
    en:
      - Annotation protocol and public documentation of the framework
  repository: https://github.com/valbergregory/abusive-litigation-jurimetrics
  repositoryVisibility: public
  languages: [Python, SQL]
  outputTypes: [artigo, software]
  codeAvailable: true
  dataAvailable: false
  featured: false
  allowAutomaticMetadata: true
  lastEditorialReview: '2026-11-02'

