# ---------------------------------------------------------------------------
- slug: pix-geography-brazil
  title: 'Forecasting Pix Across Brazil: Global Models and Coherent Geographic Reconciliation'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-digital-direito-digital
  status: em-desenvolvimento
  summary:
    pt: É possível prever a difusão e o volume do Pix município a município, com modelos globais e reconciliação coerente entre município, estado, região e país — e onde a previsão é menos confiável? Painel municipal mensal construído a partir dos dados abertos do Banco Central.
    en: Can the diffusion and volume of Pix be forecast municipality by municipality, with global models and coherent reconciliation across municipality, state, region and country — and where is the forecast least reliable? Monthly municipal panel built from the Central Bank's open data.
  researchQuestion:
    pt: Modelos globais de previsão, reconciliados de forma coerente na hierarquia município–UF–região–Brasil, preveem a geografia do Pix melhor do que modelos locais — e em quais territórios a previsão é menos confiável?
    en: Do global forecasting models, coherently reconciled across the municipality–state–region–Brazil hierarchy, forecast the geography of Pix better than local models — and in which territories is the forecast least reliable?
  motivation:
    pt: O Pix mudou a economia dos pagamentos no Brasil em poucos anos, mas a adoção não foi uniforme no território. Prever seu volume por município importa para bancos, comércio e políticas de inclusão financeira, e a coerência entre níveis geográficos evita previsões locais que não somam ao total nacional.
    en: Pix changed the economics of payments in Brazil within a few years, but adoption was not uniform across the territory. Forecasting its volume by municipality matters for banks, retailers and financial-inclusion policy, and coherence across geographic levels prevents local forecasts that do not add up to the national total.
  dataSources:
    pt:
      - Estatísticas mensais do Pix por município (dados abertos do Banco Central do Brasil), de novembro de 2020 em diante; snapshot congelado de 30/08/2026
      - Malha municipal do IBGE (2022, via geobr) e hierarquia município–UF–região–Brasil
    en:
      - Monthly Pix statistics by municipality (Banco Central do Brasil open data), from November 2020 onwards; snapshot frozen on 30 August 2026
      - IBGE municipal mesh (2022, via geobr) and the municipality–state–region–Brazil hierarchy
  methods:
    pt:
      - Geografia temporalmente estável e painel município-mês com hashes e metadados do snapshot
      - Modelos globais (Ridge e XGBoost) avaliados por origem móvel contra benchmarks locais (naive, naive sazonal, drift, ETS, ARIMA)
      - Reconciliação hierárquica (bottom-up e MinT-WLS), métricas de erro escaladas (MASE/RMSSE) e comparações pareadas com erros-padrão Newey–West
      - Testes de quebras estruturais (Bai–Perron, PELT) e regressão da confiabilidade preditiva por município
    en:
      - Temporally stable geography and municipality-month panel with snapshot hashes and metadata
      - Global models (Ridge and XGBoost) evaluated by rolling origin against local benchmarks (naive, seasonal naive, drift, ETS, ARIMA)
      - Hierarchical reconciliation (bottom-up and MinT-WLS), scaled error metrics (MASE/RMSSE) and paired comparisons with Newey–West standard errors
      - Structural-break tests (Bai–Perron, PELT) and a regression of forecast reliability by municipality
  methodTags: [series-temporais, painel, ml-explicavel]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Piloto com dois estados (Alagoas e Roraima) executado; a estimação nacional ainda não foi concluída.
      - O snapshot do BCB em uso é o de 30/08/2026; a disponibilidade do serviço de dados abertos é externa ao projeto.
      - Dois municípios do Rio Grande do Norte só aparecem na série do BCB a partir de abril de 2025 e foram excluídos do painel.
    en:
      - A two-state pilot (Alagoas and Roraima) has been run; the national estimation is not yet complete.
      - The BCB snapshot in use is from 30 August 2026; the availability of the open-data service is external to the project.
      - Two municipalities in Rio Grande do Norte only appear in the BCB series from April 2025 and were excluded from the panel.
