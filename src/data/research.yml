- slug: transmissao-precos-leite
  title: Transmissão de Preços do Leite ao Produtor entre Regiões Brasileiras
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  subtrack:
    pt: Economia agrícola e mercados
    en: Agricultural economics and markets
  status: pre-submissao
  summary:
    pt: Como os preços pagos ao produtor de leite se transmitem entre regiões brasileiras e quais mercados lideram o processo de ajuste? Séries mensais do CEPEA/ESALQ analisadas com cointegração e modelos de correção de erros.
    en: How do farm-gate milk prices transmit across Brazilian regions and which markets lead the adjustment process? Monthly CEPEA/ESALQ series analysed with cointegration and error-correction models.
  researchQuestion:
    pt: Como os preços pagos ao produtor se transmitem entre regiões brasileiras e quais mercados lideram o processo de ajuste?
    en: How do farm-gate prices transmit across Brazilian regions and which markets lead the adjustment process?
  motivation:
    pt: O leite é produzido em quase todos os estados, mas a formação de preços é regionalmente desigual. Saber quais mercados lideram e com que velocidade os demais reagem informa políticas de abastecimento, crédito rural e defesa da concorrência.
    en: Milk is produced in almost every Brazilian state, yet price formation is regionally uneven. Knowing which markets lead and how fast the others react informs supply, rural credit and competition policies.
  dataSources:
    pt:
      - Preços mensais ao produtor por estado (CEPEA/ESALQ-USP), 2016–2026
      - Deflacionamento pelo IPCA (IBGE)
    en:
      - Monthly farm-gate prices by state (CEPEA/ESALQ-USP), 2016–2026
      - Deflation by the IPCA consumer price index (IBGE)
  methods:
    pt:
      - Testes de raiz unitária e cointegração
      - Modelo vetorial de correção de erros (VECM) e versão com limiar (TVECM) para assimetrias
      - Causalidade de Granger
    en:
      - Unit-root and cointegration tests
      - Vector error-correction model (VECM) and threshold version (TVECM) for asymmetries
      - Granger causality
  methodTags: [series-temporais, cointegracao]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Preços estaduais agregam heterogeneidade dentro de cada estado.
      - Quebras estruturais (pandemia, choques de custo) exigem tratamento explícito.
    en:
      - State-level prices aggregate heterogeneity within each state.
      - Structural breaks (pandemic, cost shocks) require explicit treatment.
  implications:
    pt:
      - Identificação de mercados líderes para monitoramento de preços.
      - Subsídio para políticas de crédito e abastecimento na cadeia do leite.
    en:
      - Identification of leading markets for price monitoring.
      - Input for credit and supply policies in the dairy chain.
  extensionProducts:
    pt:
      - Boletim de preços regionais do leite para produtores e cooperativas
    en:
      - Regional milk price bulletin for producers and cooperatives
  repository: https://github.com/valbergregory/transmissao-precos-leite-brasil
  repositoryVisibility: public
  languages: [R, LaTeX]
