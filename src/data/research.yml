- slug: ia-produtividade-tribunais
  title: 'Inteligência Artificial e Produtividade no Setor Público: Evidências dos Tribunais de Justiça Brasileiros'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  subtrack:
    pt: Economia do setor público e inovação
    en: Public-sector economics and innovation
  status: pre-submissao
  summary:
    pt: A primeira adoção institucional oficial de IA foi acompanhada por ganhos agregados mensuráveis de produtividade nos Tribunais de Justiça? Painel dos 27 TJs com cronologia auditada de adoção e métodos de diferenças-em-diferenças escalonadas.
    en: Was the first official institutional adoption of AI followed by measurable aggregate productivity gains in Brazilian state courts? Panel of the 27 state courts with an audited adoption timeline and staggered difference-in-differences methods.
  researchQuestion:
    pt: A primeira adoção institucional oficial de IA foi acompanhada por ganhos agregados mensuráveis de produtividade nos Tribunais de Justiça?
    en: Was the first official institutional adoption of AI followed by measurable aggregate productivity gains in the state courts?
  motivation:
    pt: Tribunais brasileiros adotaram ferramentas de IA em ritmos diferentes desde 2018. Essa variação no tempo permite testar, com dados administrativos públicos, se a adoção se reflete em indicadores agregados de produtividade — em vez de assumir o ganho a partir de relatos de casos de uso.
    en: Brazilian courts adopted AI tools at different paces since 2018. This variation over time makes it possible to test, with public administrative data, whether adoption shows up in aggregate productivity indicators — instead of assuming gains from use-case reports.
  dataSources:
    pt:
      - Painel anual dos 27 Tribunais de Justiça (Justiça em Números, CNJ)
      - Cronologia auditada da primeira adoção institucional de IA em cada tribunal
    en:
      - Annual panel of the 27 state courts (Justiça em Números, CNJ)
      - Audited timeline of the first institutional AI adoption in each court
  methods:
    pt:
      - Efeitos fixos de tribunal e ano
      - Diferenças-em-diferenças escalonadas (estimadores robustos a heterogeneidade temporal)
      - Estudos de eventos e estimador de imputação
    en:
      - Court and year fixed effects
      - Staggered difference-in-differences (estimators robust to treatment heterogeneity)
      - Event studies and imputation estimator
  methodTags: [painel, efeitos-fixos, did, estudo-de-eventos, imputacao]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Até o estágio atual, não foram identificados ganhos médios agregados robustos e estatisticamente detectáveis de produtividade após a primeira adoção institucional de IA.
      - Esse resultado não exclui efeitos localizados por ferramenta, tarefa ou unidade judiciária, que os indicadores agregados não captam.
    en:
      - At the current stage, no robust, statistically detectable average aggregate productivity gains were identified after the first institutional adoption of AI.
      - This result does not rule out localised effects by tool, task or judicial unit, which aggregate indicators cannot capture.
  limitations:
    pt:
      - Indicadores agregados anuais são pouco sensíveis a ganhos concentrados em tarefas específicas.
      - A data de adoção oficial pode diferir da data de uso efetivo pelas unidades.
      - Um resultado nulo não é prova de que a IA não funciona; é ausência de efeito médio detectável com estes dados.
    en:
      - Annual aggregate indicators are not very sensitive to gains concentrated in specific tasks.
      - The official adoption date may differ from the date of effective use by units.
      - A null result is not proof that AI does not work; it is the absence of a detectable average effect with these data.
  implications:
    pt:
      - Avaliações de IA no Judiciário precisam de dados por tarefa e por unidade, e não apenas de indicadores agregados.
      - Cronologias auditadas de adoção são um insumo público reutilizável para outras pesquisas.
    en:
      - Evaluations of AI in the judiciary need task- and unit-level data, not only aggregate indicators.
      - Audited adoption timelines are a reusable public input for other studies.
  extensionProducts:
    pt:
      - Cronologia pública de adoção de IA pelos Tribunais de Justiça
    en:
      - Public timeline of AI adoption by the state courts
  repository: null
  repositoryVisibility: none
  languages: [R, LaTeX]
  outputTypes: [artigo, dados-abertos]
  codeAvailable: false
  dataAvailable: false
  featured: true
  featuredOrder: 1
