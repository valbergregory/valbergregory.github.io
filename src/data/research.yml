- slug: gasto-publico-educacao-dsge
  title: 'Gasto Público em Educação, Salários Regionais e Dinâmica Fiscal no Brasil: Evidências em Painel e um DSGE Fiscal com Capital Humano'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  status: pre-submissao
  summary:
    pt: Quanto o gasto público em educação retorna em produto, salários e arrecadação ao longo do tempo? O trabalho combina evidências em painel para o Brasil com um modelo DSGE fiscal em que a educação forma capital humano.
    en: How much does public spending on education return in output, wages and tax revenue over time? The paper combines panel evidence for Brazil with a fiscal DSGE model in which education builds human capital.
  researchQuestion:
    pt: Quanto o gasto público em educação retorna em produto, salários e arrecadação ao longo do tempo?
    en: How much does public spending on education return in output, wages and tax revenue over time?
  motivation:
    pt: Cortes em educação costumam ser defendidos como ajuste fiscal imediato, mas o gasto educacional forma capital humano que eleva salários e a base tributária no futuro. Medir esse retorno dinâmico ajuda a avaliar se a austeridade educacional se paga ou se custa mais do que economiza.
    en: Education cuts are often defended as immediate fiscal adjustment, yet education spending builds human capital that raises wages and the tax base in the future. Measuring this dynamic return helps assess whether educational austerity pays for itself or costs more than it saves.
  dataSources:
    pt:
      - 'Painel calibrado (simulado, com semente fixa) das 27 unidades da federação, 2010–2022: salário médio, gasto em educação per capita e PIB per capita'
      - 'Coleta opcional de séries oficiais: IPCA (BCB/SGS 433), PIB, população e rendimento estaduais (SIDRA/IBGE, tabelas 5938, 6579 e 7453) e despesa estadual em educação (SICONFI/Tesouro Nacional, RREO Anexo 02)'
      - Parâmetros calibrados para a economia brasileira no modelo DSGE
    en:
      - 'Calibrated (simulated, fixed-seed) panel of the 27 Brazilian states, 2010–2022: average wage, education spending per capita and GDP per capita'
      - 'Optional collection of official series: IPCA (BCB/SGS 433), state GDP, population and income (SIDRA/IBGE tables 5938, 6579 and 7453) and state education expenditure (SICONFI/National Treasury, RREO Annex 02)'
      - Parameters calibrated to the Brazilian economy in the DSGE model
  methods:
    pt:
      - Econometria de dados em painel (efeitos fixos bidirecionais, erros-padrão de Driscoll–Kraay, teste de Hausman)
      - Bootstrap de elasticidades por UF e encolhimento empírico-bayesiano (James–Stein) em direção à elasticidade regional
      - Modelo DSGE fiscal com capital humano resolvido por previsão perfeita não linear; cenários de corte de gasto, efeito Laffer, bem-estar e desigualdade regional
    en:
      - Panel-data econometrics (two-way fixed effects, Driscoll–Kraay standard errors, Hausman test)
      - Bootstrap of state-level elasticities and empirical-Bayes (James–Stein) shrinkage toward the regional elasticity
      - Fiscal DSGE model with human capital solved by non-linear perfect foresight; spending-cut scenarios, Laffer effect, welfare and regional inequality
  methodTags: [painel, dsge, efeitos-fixos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - O modelo depende de calibração; os resultados quantitativos são sensíveis aos parâmetros de formação de capital humano.
      - A base empírica padrão é calibrada/simulada; a coleta de séries oficiais via API está implementada apenas no porte R, como opção, e os códigos de tabela do SIDRA/SICONFI exigem conferência.
    en:
      - The model relies on calibration; quantitative results are sensitive to the human-capital formation parameters.
      - The default empirical dataset is calibrated/simulated; official-series collection through public APIs is implemented only in the R port, as an option, and the SIDRA/SICONFI table codes need checking.
  implications:
    pt:
      - Avaliação de regras fiscais e de pisos constitucionais para a educação.
      - Discussão sobre o horizonte temporal adequado para medir o retorno do gasto educacional.
    en:
      - Assessment of fiscal rules and constitutional spending floors for education.
      - Discussion of the appropriate time horizon to measure the return on education spending.
  extensionProducts:
    pt:
      - Material didático sobre política fiscal e capital humano para as disciplinas de Economia
    en:
      - Teaching material on fiscal policy and human capital for Economics courses
  repository: https://github.com/valbergregory/artigo-dsge-educacao
  repositoryVisibility: public
  languages: [Python, R, LaTeX]
  outputTypes: [artigo]
  codeAvailable: true
  dataAvailable: false
  featured: false
  allowAutomaticMetadata: true
  lastEditorialReview: '2026-11-02'

- slug: transmissao-precos-leite
  title: Transmissão de Preços do Leite ao Produtor entre Regiões Brasileiras
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  subtrack:
    pt: Economia agrícola e mercados
    en: Agricultural economics and markets
  status: pre-submissao
  summary:
    pt: Como os preços pagos ao produtor de leite se transmitem entre regiões brasileiras e quais mercados lideram o processo de ajuste? Séries mensais do CEPEA/ESALQ analisadas com cointegração e modelos de correção de erros.
    en: How do farm-gate milk prices transmit across Brazilian regions and which markets lead the adjustment process? Monthly CEPEA/ESALQ series analysed with cointegration and error-correction models.
  researchQuestion:
    pt: Como os preços pagos ao produtor se transmitem entre regiões brasileiras e quais mercados lideram o processo de ajuste?
    en: How do farm-gate prices transmit across Brazilian regions and which markets lead the adjustment process?
  motivation:
    pt: O leite é produzido em quase todos os estados, mas a formação de preços é regionalmente desigual. Saber quais mercados lideram e com que velocidade os demais reagem informa políticas de abastecimento, crédito rural e defesa da concorrência.
    en: Milk is produced in almost every Brazilian state, yet price formation is regionally uneven. Knowing which markets lead and how fast the others react informs supply, rural credit and competition policies.
  dataSources:
    pt:
      - Preços mensais ao produtor por estado (CEPEA/ESALQ-USP), jan/2016–abr/2026; 9 regiões com cobertura completa (Média Brasil, BA, ES, GO, MG, PR, RJ, SC e SP)
      - Deflacionamento pelo IPCA (IBGE), número-índice obtido pela API do IPEA
    en:
      - Monthly farm-gate prices by state (CEPEA/ESALQ-USP), Jan 2016–Apr 2026; 9 regions with full coverage (Brazil average, BA, ES, GO, MG, PR, RJ, SC and SP)
      - Deflation by the IPCA consumer price index (IBGE), index series obtained from the IPEA API
  methods:
    pt:
      - Testes de raiz unitária e cointegração (ADF, PP, KPSS; Johansen e Phillips–Ouliaris)
      - Modelo de correção de erros simétrico e assimétrico e cointegração com limiar (M-TAR)
      - VECM com limiar (TVECM) com o teste de Hansen e Seo
      - Causalidade de Granger e VAR com funções impulso-resposta e decomposição da variância
    en:
      - Unit-root and cointegration tests (ADF, PP, KPSS; Johansen and Phillips–Ouliaris)
      - Symmetric and asymmetric error-correction models and M-TAR threshold cointegration
      - Threshold VECM (TVECM) with the Hansen–Seo test
      - Granger causality and VAR with impulse-response functions and forecast-error variance decomposition
  methodTags: [series-temporais, cointegracao]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Preços estaduais agregam heterogeneidade dentro de cada estado.
      - Quebras estruturais (pandemia, choques de custo) exigem tratamento explícito.
      - Ceará e Mato Grosso do Sul ficam fora da análise por séries incompletas; meses isolados faltantes em BA, ES e RJ são interpolados.
    en:
      - State-level prices aggregate heterogeneity within each state.
      - Structural breaks (pandemic, cost shocks) require explicit treatment.
      - Ceará and Mato Grosso do Sul are left out because of incomplete series; isolated missing months in BA, ES and RJ are interpolated.
  implications:
    pt:
      - Identificação de mercados líderes para monitoramento de preços.
      - Subsídio para políticas de crédito e abastecimento na cadeia do leite.
    en:
      - Identification of leading markets for price monitoring.
      - Input for credit and supply policies in the dairy chain.
  extensionProducts:
    pt:
      - Boletim de preços regionais do leite para produtores e cooperativas
    en:
      - Regional milk price bulletin for producers and cooperatives
  repository: https://github.com/valbergregory/transmissao-precos-leite-brasil
  repositoryVisibility: public
  languages: [R, LaTeX]
  outputTypes: [artigo]
  codeAvailable: true
  dataAvailable: true
  featured: false
  allowAutomaticMetadata: true
  lastEditorialReview: '2026-11-02'

- slug: ia-produtividade-tribunais
  title: 'Inteligência Artificial e Produtividade no Setor Público: Evidências dos Tribunais de Justiça Brasileiros'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  subtrack:
    pt: Economia do setor público e inovação
    en: Public-sector economics and innovation
  status: pre-submissao
  summary:
    pt: A primeira adoção institucional oficial de IA foi acompanhada por ganhos agregados mensuráveis de produtividade nos Tribunais de Justiça? Painel dos 27 TJs com cronologia auditada de adoção e métodos de diferenças-em-diferenças escalonadas.
    en: Was the first official institutional adoption of AI followed by measurable aggregate productivity gains in Brazilian state courts? Panel of the 27 state courts with an audited adoption timeline and staggered difference-in-differences methods.
  researchQuestion:
    pt: A primeira adoção institucional oficial de IA foi acompanhada por ganhos agregados mensuráveis de produtividade nos Tribunais de Justiça?
    en: Was the first official institutional adoption of AI followed by measurable aggregate productivity gains in the state courts?
  motivation:
    pt: Tribunais brasileiros adotaram ferramentas de IA em ritmos diferentes desde 2018. Essa variação no tempo permite testar, com dados administrativos públicos, se a adoção se reflete em indicadores agregados de produtividade — em vez de assumir o ganho a partir de relatos de casos de uso.
    en: Brazilian courts adopted AI tools at different paces since 2018. This variation over time makes it possible to test, with public administrative data, whether adoption shows up in aggregate productivity indicators — instead of assuming gains from use-case reports.
  dataSources:
    pt:
      - Painel anual dos 27 Tribunais de Justiça, 2009–2025 (Justiça em Números, CNJ)
      - Cronologia da primeira adoção institucional de IA em cada tribunal, com fonte, URL e grau de confiança por tribunal (CC BY 4.0, no repositório)
    en:
      - Annual panel of the 27 state courts, 2009–2025 (Justiça em Números, CNJ)
      - Timeline of the first institutional AI adoption in each court, with source, URL and confidence level per court (CC BY 4.0, in the repository)
  methods:
    pt:
      - Efeitos fixos de tribunal e ano
      - Diferenças-em-diferenças escalonadas (estimadores robustos a heterogeneidade temporal)
      - Estudos de eventos e estimador de imputação
      - Inferência para poucos clusters (CR2 e wild cluster bootstrap), definições alternativas da data de adoção, leave-one-tribunal-out e efeito mínimo detectável
    en:
      - Court and year fixed effects
      - Staggered difference-in-differences (estimators robust to treatment heterogeneity)
      - Event studies and imputation estimator
      - Few-cluster inference (CR2 and wild cluster bootstrap), alternative adoption-date definitions, leave-one-court-out and minimum detectable effect
  methodTags: [painel, efeitos-fixos, did, estudo-de-eventos, imputacao]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Até o estágio atual, não foram identificados ganhos médios agregados robustos e estatisticamente detectáveis de produtividade após a primeira adoção institucional de IA.
      - Esse resultado não exclui efeitos localizados por ferramenta, tarefa ou unidade judiciária, que os indicadores agregados não captam.
    en:
      - At the current stage, no robust, statistically detectable average aggregate productivity gains were identified after the first institutional adoption of AI.
      - This result does not rule out localised effects by tool, task or judicial unit, which aggregate indicators cannot capture.
  limitations:
    pt:
      - Indicadores agregados anuais são pouco sensíveis a ganhos concentrados em tarefas específicas.
      - A data de adoção oficial pode diferir da data de uso efetivo pelas unidades.
      - Um resultado nulo não é prova de que a IA não funciona; é ausência de efeito médio detectável com estes dados.
      - Com apenas 27 tribunais, a inferência depende de correções para poucos clusters; para alguns tribunais a data de entrada em produção permanece incerta.
    en:
      - Annual aggregate indicators are not very sensitive to gains concentrated in specific tasks.
      - The official adoption date may differ from the date of effective use by units.
      - A null result is not proof that AI does not work; it is the absence of a detectable average effect with these data.
      - With only 27 courts, inference relies on few-cluster corrections; for some courts the date of entry into production remains uncertain.
  implications:
    pt:
      - Avaliações de IA no Judiciário precisam de dados por tarefa e por unidade, e não apenas de indicadores agregados.
      - Cronologias auditadas de adoção são um insumo público reutilizável para outras pesquisas.
    en:
      - Evaluations of AI in the judiciary need task- and unit-level data, not only aggregate indicators.
      - Audited adoption timelines are a reusable public input for other studies.
  extensionProducts:
    pt:
      - Cronologia pública e auditada de adoção de IA pelos Tribunais de Justiça (dado aberto, CC BY 4.0, no repositório)
    en:
      - Public, audited timeline of AI adoption by the state courts (open data, CC BY 4.0, in the repository)
  repository: https://github.com/valbergregory/ia-produtividade-tjs-brasil
  repositoryVisibility: public
  languages: [R, LaTeX]
  outputTypes: [artigo, dados-abertos]
  codeAvailable: true
  dataAvailable: true
  featured: true
  featuredOrder: 1
  allowAutomaticMetadata: true
  lastEditorialReview: '2026-11-02'

# Artigos derivados da tese de doutorado (PPGE/UFPB, 2023), em pré-submissão (22/09/2026).
