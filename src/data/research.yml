    en: How do marine heatwaves and changes in ocean productivity affect fishing effort along the Brazilian coast?
  motivation:
    pt: O interesse por Economia Pesqueira foi fortalecido ao lecionar a disciplina para Engenharia de Pesca na UFAL, em Penedo, em 2026. Eventos térmicos extremos estão mais frequentes, e a resposta da frota — atração, redução ou deslocamento — importa para comunidades costeiras e gestão pesqueira.
    en: Interest in fisheries economics grew while teaching the subject to Fisheries Engineering students at UFAL, Penedo, in 2026. Extreme thermal events are becoming more frequent, and the fleet's response - attraction, reduction or displacement - matters for coastal communities and fisheries management.
  dataSources:
    pt:
      - Esforço de pesca por célula e dia (Global Fishing Watch), 2013–2024
      - Temperatura da superfície do mar (NOAA OISST) e índices de produtividade oceânica
    en:
      - Fishing effort by cell and day (Global Fishing Watch), 2013–2024
      - Sea-surface temperature (NOAA OISST) and ocean-productivity indices
  methods:
    pt:
      - Cubo de dados geoespacial (H3, Parquet/DuckDB)
      - Painéis célula-dia com efeitos fixos e testes de placebo
    en:
      - Geospatial data cube (H3, Parquet/DuckDB)
      - Cell-day panels with fixed effects and placebo tests
  methodTags: [cubo-de-dados, painel, efeitos-fixos, inferencia-causal]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Anomalias térmicas moderadas e eventos extremos podem produzir efeitos distintos sobre atração, redução ou deslocamento do esforço pesqueiro.
