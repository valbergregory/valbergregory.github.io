      - O modelo depende de calibração; os resultados quantitativos são sensíveis aos parâmetros de formação de capital humano.
      - A escolha entre o título principal e o alternativo ainda não foi definida.
    en:
      - The model relies on calibration; quantitative results are sensitive to the human-capital formation parameters.
      - The choice between the main and the alternative title has not been made yet.
  implications:
    pt:
      - Avaliação de regras fiscais e de pisos constitucionais para a educação.
      - Discussão sobre o horizonte temporal adequado para medir o retorno do gasto educacional.
    en:
      - Assessment of fiscal rules and constitutional spending floors for education.
      - Discussion of the appropriate time horizon to measure the return on education spending.
  extensionProducts:
