- slug: gatekeeping-the-quantum
  title: "Gatekeeping the Quantum: How Brazil's Superior Court of Justice Reviews Moral-Damages Awards"
  titleProvisional: true
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: Quando o STJ aceita revisar o quantum do dano moral e como a Súmula 7 funciona como barreira de acesso a essa revisão? Censo de metadados de decisões do STJ e leitura estruturada dos textos.
    en: When does the Superior Court of Justice (STJ) agree to review the amount of moral damages, and how does Precedent 7 (Súmula 7) act as a gate to that review? Census of STJ decision metadata and structured reading of the texts.
  researchQuestion:
    pt: Quando o STJ aceita revisar o quantum do dano moral e como a Súmula 7 funciona como barreira de acesso a essa revisão?
    en: When does the STJ agree to review the quantum of moral damages, and how does Súmula 7 act as a barrier to that review?
  motivation:
    pt: O STJ diz que só revisa valores "irrisórios ou exorbitantes", mas a fronteira entre reexame de fato (vedado pela Súmula 7) e questão de direito é decidida caso a caso. Mapear essa fronteira com dados mostra o que a regra faz na prática.
    en: The STJ says it only reviews awards that are "derisory or exorbitant", but the line between re-examining facts (barred by Súmula 7) and a question of law is drawn case by case. Mapping that line with data shows what the rule does in practice.
  dataSources:
    pt:
      - Metadados e textos de decisões do Superior Tribunal de Justiça sobre danos morais
    en:
      - Metadata and texts of Superior Court of Justice decisions on moral damages
  methods:
    pt:
      - Censo e amostragem de decisões; classificação estruturada dos fundamentos
      - Modelos para a probabilidade de conhecimento do recurso e de revisão do valor
    en:
      - Census and sampling of decisions; structured classification of grounds
      - Models for the probability of admitting the appeal and of revising the amount
  methodTags: [text-mining, nlp]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Título provisório, ainda sujeito a confirmação.
      - O protocolo de anotação das decisões ainda está em validação.
    en:
      - Provisional title, still subject to confirmation.
      - The decision annotation protocol is still under validation.
  implications:
    pt:
      - Evidência sobre o papel dos filtros recursais na uniformização das indenizações.
    en:
      - Evidence on the role of appellate filters in harmonising awards.
  extensionProducts:
    pt:
      - Base anotada de decisões do STJ sobre revisão do quantum (após validação)
    en:
      - Annotated dataset of STJ decisions on quantum review (after validation)
