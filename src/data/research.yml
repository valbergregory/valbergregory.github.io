- slug: binding-precedents
  title: 'Do Binding Precedents Actually Bind? Measuring Judicial Compliance and Diffusion Across Brazilian Courts'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: Os precedentes vinculantes realmente se difundem e são aplicados pelos tribunais de origem? Em qual velocidade e com quais diferenças territoriais?
    en: Do binding precedents actually diffuse and get applied by the lower courts? How fast, and with which territorial differences?
  researchQuestion:
    pt: Os precedentes vinculantes realmente se difundem e são aplicados pelos tribunais de origem? Em qual velocidade e com quais diferenças territoriais?
    en: Do binding precedents actually diffuse and get applied by the courts of origin? How fast, and with which territorial differences?
  motivation:
    pt: O sistema de precedentes qualificados do CPC de 2015 promete uniformidade e previsibilidade. Medir se, quando e onde os tribunais passam a aplicar cada tese permite avaliar a promessa com dados, e não apenas com doutrina.
    en: The qualified-precedent system of Brazil's 2015 Civil Procedure Code promises uniformity and predictability. Measuring whether, when and where courts start applying each precedent allows the promise to be assessed with data rather than doctrine alone.
  dataSources:
    pt:
      - Registro de precedentes qualificados do STJ (temas repetitivos, controvérsias, IAC, PUIL, SIRDR) e processos paradigma — Portal de Dados Abertos do STJ
      - Íntegras das decisões terminativas e acórdãos do STJ publicados no DJe (desde 2021), agrupadas por tribunal de origem
      - Atas de distribuição e acervo em tramitação do STJ (recuperação do tribunal de origem pelo número CNJ)
      - Metadados processuais da API Pública do DataJud (CNJ)
      - Indicadores institucionais por tribunal-ano da base Justiça em Números (CNJ)
      - Temas de repercussão geral do STF, observados apenas como citados nas decisões do STJ
    en:
      - STJ registry of qualified precedents (repetitive themes, controvérsias, IAC, PUIL, SIRDR) and paradigm cases — STJ Open Data Portal
      - Full text of STJ terminative decisions and judgments published in the DJe (from 2021), grouped by court of origin
      - STJ distribution records and pending-case snapshot (court-of-origin recovery via the CNJ case number)
      - Case metadata from the CNJ DataJud public API
      - Court-year institutional indicators from CNJ Justiça em Números
      - STF general-repercussion themes, observed only as cited in STJ decisions
  methods:
    pt:
      - Extração de citações por expressões regulares e classificadores de texto para distinguir citação formal, aplicação material, conformidade de resultado, distinção e afastamento
      - Análise de sobrevivência (tempo até a primeira citação/aplicação por tribunal), modelos multinível e análise espacial da heterogeneidade entre tribunais
      - Estudo de eventos em torno da data de fixação da tese
    en:
      - Regex citation extraction and text classifiers distinguishing formal citation, material application, outcome conformity, reasoned distinction and departure
      - Survival analysis (time to first citation/application by court), multilevel models and spatial analysis of cross-court heterogeneity
      - Event study around the fixation date of each precedent
  methodTags: [nlp, text-mining, sobrevivencia, analise-espacial, estudo-de-eventos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - O texto integral das decisões dos tribunais de origem não está disponível em massa; a adoção é medida no fluxo recursal que chegou ao STJ, condicionada à interposição de recurso.
      - A prova de conceito foi executada com um tema-piloto provisório, ainda não confirmado.
    en:
      - Bulk full text of lower-court decisions is not available; adoption is measured in the appellate flow that reached the STJ, conditional on an appeal being filed.
      - The proof of concept was run on a provisional pilot precedent, not yet confirmed.
  implications:
    pt:
      - Indicadores de aderência a precedentes para gestão judiciária e para o debate sobre o sistema de precedentes.
    en:
      - Precedent-compliance indicators for court management and for the debate on the precedent system.
  extensionProducts:
    pt:
      - Painel de difusão de precedentes por tribunal
    en:
      - Precedent-diffusion dashboard by court
  repository: https://github.com/valbergregory/binding-precedents-brazil
  repositoryVisibility: public
  languages: [Python, R, SQL]
