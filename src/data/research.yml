  subtrack:
    pt: IA e prática jurídica
    en: AI and legal practice
  status: estruturacao
  summary:
    pt: Minutas elaboradas por modelos de linguagem com recuperação de contexto (RAG) são juridicamente confiáveis? Projeto em estruturação para avaliar correção jurídica, fundamentação, atualização normativa, citações, alucinações, consistência e estabilidade.
    en: Are drafts produced by retrieval-augmented language models legally reliable? Project being structured to assess legal correctness, reasoning, normative currency, citations, hallucinations, consistency and stability.
  researchQuestion:
    pt: Minutas elaboradas por modelos de linguagem com RAG são juridicamente confiáveis?
    en: Are drafts produced by retrieval-augmented language models legally reliable?
  motivation:
    pt: Tribunais e escritórios já usam modelos de linguagem para redigir minutas. Antes de confiar nelas, é preciso medir, com um protocolo replicável, onde elas acertam, onde erram e quão estáveis são as respostas.
    en: Courts and law firms already use language models to draft decisions. Before relying on them, one needs to measure, with a replicable protocol, where they are right, where they fail and how stable their answers are.
  dataSources:
    pt:
      - Conjunto de casos-teste e gabaritos elaborados com revisão jurídica humana (em definição)
    en:
      - Set of test cases and answer keys built with human legal review (being defined)
  methods:
    pt:
      - Benchmark de modelos de linguagem com e sem recuperação de contexto
      - 'Avaliação em sete dimensões: correção jurídica, fundamentação, atualização normativa, citações, alucinações, consistência e estabilidade'
    en:
      - Benchmark of language models with and without retrieval-augmented generation
      - Assessment across seven dimensions - legal correctness, reasoning, normative currency, citations, hallucinations, consistency and stability
  methodTags: [benchmark, nlp]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Projeto em estruturação; ainda não há repositório público nem resultados.
    en:
      - Project being structured; there is no public repository or results yet.
