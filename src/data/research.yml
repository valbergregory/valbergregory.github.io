- slug: gatekeeping-the-quantum
  title: "Gatekeeping the Quantum: How Brazil's Superior Court of Justice Reviews Moral-Damages Awards"
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: Quando o STJ aceita revisar o quantum do dano moral e como a Súmula 7 funciona como barreira de acesso a essa revisão? Censo de metadados de decisões do STJ e leitura estruturada dos textos.
    en: When does the Superior Court of Justice (STJ) agree to review the amount of moral damages, and how does Precedent 7 (Súmula 7) act as a gate to that review? Census of STJ decision metadata and structured reading of the texts.
  researchQuestion:
    pt: Quando o STJ aceita revisar o quantum do dano moral e como a Súmula 7 funciona como barreira de acesso a essa revisão?
    en: When does the STJ agree to review the quantum of moral damages, and how does Súmula 7 act as a barrier to that review?
  motivation:
    pt: O STJ diz que só revisa valores "irrisórios ou exorbitantes", mas a fronteira entre reexame de fato (vedado pela Súmula 7) e questão de direito é decidida caso a caso. Mapear essa fronteira com dados mostra o que a regra faz na prática.
    en: The STJ says it only reviews awards that are "derisory or exorbitant", but the line between re-examining facts (barred by Súmula 7) and a question of law is drawn case by case. Mapping that line with data shows what the rule does in practice.
  dataSources:
    pt:
      - 'Portal de Dados Abertos do STJ: íntegras e metadados diários de decisões terminativas e acórdãos publicados no DJe (desde 2021), precedentes qualificados e acervo em tramitação'
      - IPCA (IBGE/SIDRA, tabela 1737) para deflação dos valores
      - Tabela Processual Unificada de assuntos (CNJ) para seleção por matéria
    en:
      - 'STJ Open Data Portal: full texts and daily metadata of terminative decisions and rulings published in the DJe (from 2021), qualified precedents and pending-docket snapshot'
      - IPCA (IBGE/SIDRA, table 1737) to deflate award values
      - CNJ unified subject table (TPU) for topic selection
  methods:
    pt:
      - Censo dos metadados por família de assunto (TPU) e extração contextual de valores monetários nos textos, com anotação manual para medir a validade da extração
      - 'Plano de análise pré-especificado: regressão quantílica, modelo hierárquico por tribunal de origem, regressão logística para a intervenção do STJ no valor, séries com quebras estruturais e estudo de evento, modelo preditivo com intervalos conformais'
    en:
      - Metadata census by TPU subject family and contextual extraction of monetary values from the texts, with manual annotation to measure extraction validity
      - 'Pre-specified analysis plan: quantile regression, hierarchical model by court of origin, logistic regression for STJ intervention in the amount, time series with structural breaks and an event study, predictive model with conformal intervals'
  methodTags: [text-mining, nlp, series-temporais, estudo-de-eventos, ml-explicavel]
  showPreliminaryFindings: false
  limitations:
    pt:
      - O protocolo de anotação das decisões ainda está em validação; nenhuma estimação foi executada.
      - O tribunal/UF de origem só é identificável em parte dos documentos (texto da decisão; o acervo em tramitação cobre apenas processos pendentes).
      - O corpus do STJ é produto de filtros recursais e não representa as indenizações nacionais; o STJ raramente altera o valor.
    en:
      - The decision annotation protocol is still under validation; no estimation has been run.
      - The court/state of origin can be identified only for part of the documents (from the decision text; the pending-docket dataset covers only pending cases).
      - The STJ corpus is the product of appellate filters and does not represent national awards; the STJ rarely changes the amount.
  implications:
    pt:
      - Evidência sobre o papel dos filtros recursais na uniformização das indenizações.
    en:
      - Evidence on the role of appellate filters in harmonising awards.
  extensionProducts:
    pt:
      - Base anotada de decisões do STJ sobre revisão do quantum (após validação)
    en:
      - Annotated dataset of STJ decisions on quantum review (after validation)
