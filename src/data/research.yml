- slug: pix-regulation-fraud
  title: 'Regulatory Interventions, Fraud, and Pix Diffusion: A Time-Series Analysis of Security Measures'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-digital-direito-digital
  status: pre-submissao
  summary:
    pt: As medidas de segurança do Pix estão associadas a mudanças na incidência e na gravidade das fraudes registradas, na recuperação de valores e na intensidade de uso do sistema? Séries mensais públicas do Banco Central analisadas com séries temporais interrompidas e modelos ARIMAX.
    en: Are Pix security regulations associated with changes in the incidence and severity of recorded fraud, fund recovery and the intensity of system use? Monthly public series from the Central Bank analysed with interrupted time series and ARIMAX models.
  researchQuestion:
    pt: As intervenções regulatórias de segurança do Pix estão associadas a mudanças na incidência relativa e na gravidade financeira das fraudes, na recuperação de valores e no uso do sistema?
    en: Are Pix security interventions associated with changes in the relative incidence and financial severity of fraud, in fund recovery and in system use?
  motivation:
    pt: O Pix popularizou os pagamentos instantâneos no Brasil e, com eles, os golpes em que a própria vítima autoriza a transferência. O Banco Central respondeu com uma sequência de regras de segurança; medir sua associação com fraude e uso ajuda a calibrar a regulação sem frear a difusão.
    en: Pix made instant payments widespread in Brazil and, with them, scams in which the victim authorises the transfer. The Central Bank responded with a sequence of security rules; measuring their association with fraud and use helps calibrate regulation without slowing diffusion.
  dataSources:
    pt:
      - Estatísticas mensais do Pix e do Mecanismo Especial de Devolução (dados abertos do Banco Central do Brasil)
      - Cronologia das intervenções regulatórias de segurança, conferida em fonte oficial
    en:
      - Monthly Pix and Special Return Mechanism (MED) statistics (Banco Central do Brasil open data)
      - Chronology of security interventions, checked against official sources
  methods:
    pt:
      - Auditoria de mensuração das séries públicas
      - Séries temporais interrompidas e modelos ARIMAX, condicionados ao comprimento e à comparabilidade das séries
    en:
      - Measurement audit of the public series
      - Interrupted time series and ARIMAX models, conditional on series length and comparability
  methodTags: [series-temporais]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Manuscrito em pré-submissão; os resultados serão divulgados após a avaliação por pares.
      - As séries públicas comparáveis são curtas; análises com menos de 12 meses antes e depois de cada intervenção são tratadas como exploratórias.
    en:
      - Manuscript at the pre-submission stage; results will be released after peer review.
      - Comparable public series are short; analyses with fewer than 12 months before and after an intervention are treated as exploratory.
  implications:
    pt:
      - Desenho e avaliação de regras de segurança em pagamentos instantâneos.
    en:
      - Design and evaluation of security rules for instant payments.
  extensionProducts:
    pt:
      - Material didático sobre regulação de pagamentos e sistemas de informação
    en:
      - Teaching material on payments regulation and information systems
