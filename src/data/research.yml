- slug: geography-of-judicial-delay
  title: 'The Geography of Judicial Delay: Spatial Inequality and Procedural Trajectories in Brazil'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: A duração do processo depende do lugar em que ele tramita? Trajetórias processuais do DataJud analisadas com métodos espaciais e de sobrevivência para explicar a desigualdade territorial da demora.
    en: Does case duration depend on where the case is processed? Procedural trajectories from DataJud analysed with spatial and survival methods to explain territorial inequality in delay.
  researchQuestion:
    pt: A duração do processo depende do lugar em que ele tramita e quais características territoriais e institucionais explicam essa desigualdade?
    en: Does case duration depend on where the case is processed, and which territorial and institutional characteristics explain that inequality?
  motivation:
    pt: A demora judicial é medida por médias nacionais, mas quem litiga vive em uma comarca específica. Diferenças entre comarcas vizinhas, com estruturas parecidas, apontam para causas institucionais que políticas de gestão podem enfrentar.
    en: Judicial delay is measured by national averages, but litigants live in a specific judicial district. Differences between neighbouring districts with similar structures point to institutional causes that management policies can address.
  dataSources:
    pt:
      - Movimentações processuais públicas do DataJud (CNJ), com sondagem em 12 tribunais estaduais (classes 7 e 436, coortes 2018–2023)
      - Tabelas Processuais Unificadas do CNJ (movimentos, classes e complementos), base do dicionário movimento → estado
      - Características territoriais e institucionais das comarcas (IBGE/SIDRA e malhas, Anatel, Justiça em Números)
    en:
      - Public case-movement records from DataJud (CNJ), with a pilot in 12 state courts (classes 7 and 436, 2018–2023 cohorts)
      - CNJ Unified Procedural Tables (movements, classes and complements), basis of the movement → state dictionary
      - Territorial and institutional characteristics of judicial districts (IBGE/SIDRA and meshes, Anatel, Justiça em Números)
  methods:
    pt:
      - Reconstrução de trajetórias processuais a partir de um dicionário transparente TPU → estado (movimento, complemento, papel e confiança), com auditoria por tribunal e classe
      - Análise de sobrevivência e modelos espaciais
    en:
      - Reconstruction of procedural trajectories from a transparent TPU → state dictionary (movement, complement, role and confidence), audited by court and class
      - Survival analysis and spatial models
  methodTags: [analise-espacial, sobrevivencia, painel]
  showPreliminaryFindings: false
  limitations:
    pt:
      - A coleta ampla ainda não foi iniciada; o recorte A (TJCE e TJPE) foi recomendado e o piloto depende de autorização registrada.
      - A qualidade do registro de movimentações varia entre tribunais e sistemas (SAJ, PJe, eproc, Projudi); a etapa de defesa só é mensurável onde a petição é tipada, e alguns tribunais não informam o município da unidade na maior parte dos documentos.
      - A censura administrativa (data da última atualização) varia por tribunal.
    en:
      - Large-scale collection has not started; sample A (TJCE and TJPE) was recommended and the pilot depends on a recorded authorisation.
      - The quality of movement records varies across courts and case-management systems (SAJ, PJe, eproc, Projudi); the defence stage is measurable only where the petition is typed, and some courts lack the unit's municipality in most documents.
      - Administrative censoring (date of last update) varies by court.
  implications:
    pt:
      - Mapas de demora por comarca para gestão judiciária e políticas de acesso à Justiça.
    en:
      - Delay maps by judicial district for court management and access-to-justice policies.
  extensionProducts:
    pt:
      - Mapas e painéis de duração processual por território
    en:
      - Maps and dashboards of case duration by territory
  repository: https://github.com/valbergregory/Geography-of-Judicial-Delay
  repositoryVisibility: public
  languages: [R, SQL]
  outputTypes: [artigo, painel-publico]
