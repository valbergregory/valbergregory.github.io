- slug: pricing-non-pecuniary-harm
  title: 'Pricing Non-Pecuniary Harm: A Jurimetric Analysis of Moral Damages Awards in a Brazilian Appellate Court (Federal District, 2015–2025)'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-direito-jurimetria
  status: em-desenvolvimento
  summary:
    pt: Quais fatores explicam o valor das indenizações por danos morais e quanto varia a decisão entre casos semelhantes? Acórdãos do TJDFT entre 2015 e 2025 tratados como dados.
    en: Which factors explain the value of moral damages awards and how much do decisions vary across similar cases? Appellate decisions of the Federal District court (TJDFT), 2015–2025, treated as data.
  researchQuestion:
    pt: Quais fatores explicam o valor das indenizações por danos morais e quanto varia a decisão entre casos semelhantes?
    en: Which factors explain the value of moral damages awards and how much do decisions vary across similar cases?
  motivation:
    pt: O dano moral não tem tabela legal no Brasil. A dispersão dos valores entre casos parecidos afeta a previsibilidade, o incentivo a litigar e a igualdade de tratamento. Medir essa dispersão e seus determinantes é o primeiro passo para discuti-la com evidência.
    en: Moral damages have no statutory schedule in Brazil. The dispersion of awards across similar cases affects predictability, incentives to litigate and equal treatment. Measuring that dispersion and its determinants is the first step to discussing it with evidence.
  dataSources:
    pt:
      - Acórdãos públicos do Tribunal de Justiça do Distrito Federal e dos Territórios (API JurisDF, 2015–2025)
      - Extração estruturada de valores, matéria e características do caso a partir do texto
      - Dados abertos do STJ (precedentes qualificados como calendário de eventos; íntegras e espelhos das 3ª e 4ª Turmas)
      - IPCA e salário mínimo (séries SGS 433 e 1619 do Banco Central) para deflacionamento
    en:
      - Public appellate decisions of the Federal District court (JurisDF API, 2015–2025)
      - Structured extraction of award values, subject matter and case characteristics from text
      - STJ open data (qualified precedents as an event calendar; full texts and panel summaries of the 3rd and 4th Panels)
      - IPCA and minimum wage (Central Bank SGS series 433 and 1619) for deflation
  methods:
    pt:
      - Mineração de texto e extração de valores por regras, com validação humana cega
      - Regressão quantílica por tipo de lesão e estrato (Turmas Cíveis e Recursais) e modelo multinível para a parcela de variância atribuível a relator e órgão
      - Estudo de eventos em torno dos precedentes qualificados do STJ
    en:
      - Text mining and rule-based value extraction, with blind human validation
      - Quantile regression by type of harm and stratum (civil and small-claims appellate panels) and multilevel model for the share of variance attributable to rapporteur and panel
      - Event study around qualified STJ precedents
  methodTags: [text-mining, estudo-de-eventos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - A validação humana do extrator de valores (anotação cega de acórdãos) ainda está em curso; nenhum resultado é reportado antes dela.
      - Apenas casos que chegaram à segunda instância são observados; as Turmas Recursais têm teto de 40 salários mínimos e composição distinta, por isso os estratos não são comparáveis causalmente.
    en:
      - Human validation of the value extractor (blind annotation of decisions) is still under way; no result is reported before it.
      - Only cases that reached the appellate level are observed; small-claims appellate panels have a 40-minimum-wage cap and a different composition, so strata are not causally comparable.
  implications:
    pt:
      - Parâmetros empíricos para o debate sobre previsibilidade das indenizações.
      - Ferramentas de consulta para advogados, juízes e pesquisadores.
    en:
      - Empirical parameters for the debate on award predictability.
      - Reference tools for lawyers, judges and researchers.
  extensionProducts:
    pt:
      - Painel de consulta de valores por matéria (após validação)
    en:
      - Award-value lookup dashboard by subject matter (after validation)
  repository: https://github.com/valbergregory/Pricing-Non-Pecuniary-Harm
