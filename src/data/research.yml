- slug: proinfo-integrado-laboratorios
  title: 'Laboratórios de informática e desempenho escolar no Brasil: uma reavaliação do ProInfo Integrado'
  alternativeTitle: 'Computer laboratories and school achievement in Brazil: a reassessment of ProInfo Integrado'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  status: pre-submissao
  summary:
    pt: A instalação de laboratórios de informática pelo ProInfo Integrado, que chegou a cerca de 89,5 mil escolas públicas entre 2007 e 2019, elevou o desempenho escolar? Artigo derivado da tese de doutorado, que reavalia o programa com diferenças em diferenças escalonadas e discute a sensibilidade desse desenho quando a adoção é quase universal.
    en: Did the installation of computer laboratories by ProInfo Integrado, which reached about 89,500 Brazilian public schools between 2007 and 2019, raise school achievement? A paper derived from the doctoral thesis that reassesses the programme with staggered difference-in-differences and discusses how sensitive this design becomes when adoption is nearly universal.
  researchQuestion:
    pt: A instalação de laboratórios de informática pelo ProInfo Integrado elevou o Ideb e as notas do Saeb das escolas públicas atendidas?
    en: Did the installation of computer laboratories by ProInfo Integrado raise the Ideb index and Saeb scores of the public schools it reached?
  motivation:
    pt: O Brasil investiu por mais de uma década na informatização das escolas públicas. Saber se esse investimento se traduziu em aprendizagem, e com que grau de confiança, orienta novas rodadas de política de tecnologia educacional.
    en: Brazil invested for more than a decade in equipping public schools with computers. Knowing whether that investment translated into learning, and with what degree of confidence, informs new rounds of educational-technology policy.
  dataSources:
    pt:
      - Registros administrativos do FNDE sobre a entrega e a instalação dos laboratórios
      - Censo Escolar, Ideb e Saeb (Inep), painéis de escolas dos anos iniciais e finais do ensino fundamental
    en:
      - FNDE administrative records on laboratory delivery and installation
      - School Census, Ideb and Saeb (Inep), panels of primary and lower-secondary schools
  methods:
    pt:
      - Diferenças em diferenças com adoção escalonada (Callaway e Sant'Anna), com escolas ainda não tratadas como comparação
      - Análise de sensibilidade (HonestDiD), placebos e definições alternativas da data de tratamento
    en:
      - Staggered-adoption difference-in-differences (Callaway and Sant'Anna) with not-yet-treated schools as controls
      - Sensitivity analysis (HonestDiD), placebos and alternative treatment-timing definitions
  methodTags: [painel, did, estudo-de-eventos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Manuscrito em pré-submissão; os resultados serão divulgados após a avaliação por pares.
    en:
      - Manuscript at the pre-submission stage; results will be released after peer review.
  implications:
    pt:
      - Avaliação de programas de tecnologia educacional e do custo de oportunidade dos equipamentos.
      - Cuidados no uso de diferenças em diferenças escalonadas sob adoção quase universal.
    en:
      - Evaluation of educational-technology programmes and of the opportunity cost of equipment.
      - Caveats for staggered difference-in-differences under near-universal adoption.
  extensionProducts:
    pt:
      - Material didático sobre avaliação de políticas educacionais para as disciplinas de Economia
    en:
      - Teaching material on education-policy evaluation for Economics courses
  repository: null
  repositoryVisibility: none
  languages: [R, LaTeX]
  outputTypes: [artigo]
  codeAvailable: false
  dataAvailable: false
  featured: false
  allowAutomaticMetadata: false
  lastEditorialReview: '2026-09-22'

- slug: prouca-laptops-desempenho
  title: "Brazil's One Computer per Student Programme and school achievement: evidence from the 2010 laptop distribution"
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-politicas-publicas
  status: pre-submissao
  summary:
    pt: A distribuição de 143 mil laptops a 367 escolas públicas pelo Programa Um Computador por Aluno (Prouca), em 2010, melhorou o desempenho dos alunos? Artigo derivado da tese de doutorado, que estima o efeito da participação no programa sobre o Ideb, as notas do Saeb e as taxas de rendimento.
    en: Did the distribution of 143,000 laptops to 367 public schools by Brazil's One Computer per Student Programme (Prouca) in 2010 improve pupil achievement? A paper derived from the doctoral thesis that estimates the effect of programme participation on the Ideb index, Saeb scores and progression rates.
  researchQuestion:
    pt: A participação no Prouca alterou o Ideb, as notas de matemática e língua portuguesa do Saeb e as taxas de aprovação, reprovação e abandono das escolas atendidas?
    en: Did participation in Prouca change the Ideb index, Saeb mathematics and Portuguese scores and the approval, retention and dropout rates of the schools involved?
  motivation:
    pt: Governos de países de renda média continuam comprando dispositivos individuais para estudantes, embora a evidência sobre ganhos de aprendizagem seja mista. O Prouca é um caso brasileiro de grande escala para testar essa aposta.
    en: Governments in middle-income countries keep buying personal devices for pupils although the evidence on learning gains is mixed. Prouca is a large-scale Brazilian case for testing that bet.
  dataSources:
    pt:
      - Lista de escolas participantes e quantidade de laptops entregues (Prouca, 2010)
      - Censo Escolar, Ideb, Saeb e taxas de rendimento (Inep), 2005–2015
    en:
      - List of participating schools and number of laptops delivered (Prouca, 2010)
      - School Census, Ideb, Saeb and progression rates (Inep), 2005–2015
  methods:
    pt:
      - Diferenças em diferenças com efeitos fixos de escola e ano, balanceamento por entropia e pareamento
      - Placebos pré-programa, estudo de eventos, ajuste para testes múltiplos e relação dose-resposta
    en:
      - Difference-in-differences with school and year fixed effects, entropy balancing and matching
      - Pre-programme placebos, event study, multiple-testing adjustment and dose-response analysis
  methodTags: [painel, did, efeitos-fixos, estudo-de-eventos]
  showPreliminaryFindings: false
  limitations:
    pt:
      - Manuscrito em pré-submissão; os resultados serão divulgados após a avaliação por pares.
    en:
      - Manuscript at the pre-submission stage; results will be released after peer review.
  implications:
    pt:
      - Desenho de programas de dispositivos individuais (conectividade, manutenção e integração pedagógica).
      - Custo de oportunidade dos recursos aplicados em equipamentos.
    en:
      - Design of one-to-one device programmes (connectivity, maintenance and pedagogical integration).
      - Opportunity cost of resources spent on equipment.
  extensionProducts:
    pt:
      - Material didático sobre avaliação de políticas educacionais para as disciplinas de Economia
    en:
      - Teaching material on education-policy evaluation for Economics courses
