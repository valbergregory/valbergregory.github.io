- slug: marine-heatwaves-fishing-effort
  title: 'Marine Heatwaves and Fishing Effort: High-Frequency Evidence from the Brazilian Coast'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-pesqueira
  status: redacao
  summary:
    pt: Como ondas de calor marinhas afetam a intensidade e a distribuição espacial do esforço pesqueiro na costa brasileira? Cubo de dados geoespacial célula-mês (grade H3) com esforço de pesca e temperatura da superfície do mar, 2013–2024.
    en: How do marine heatwaves affect the intensity and spatial distribution of fishing effort along the Brazilian coast? Cell-month geospatial data cube (H3 grid) combining fishing effort and sea-surface temperature, 2013–2024.
  researchQuestion:
    pt: Como ondas de calor marinhas afetam a intensidade e a distribuição espacial do esforço pesqueiro na costa brasileira?
    en: How do marine heatwaves affect the intensity and spatial distribution of fishing effort along the Brazilian coast?
  motivation:
    pt: O interesse por Economia Pesqueira foi fortalecido ao lecionar a disciplina para Engenharia de Pesca na UFAL, em Penedo, em 2026. Eventos térmicos extremos estão mais frequentes, e a resposta da frota — atração, redução ou deslocamento — importa para comunidades costeiras e gestão pesqueira.
    en: Interest in fisheries economics grew while teaching the subject to Fisheries Engineering students at UFAL, Penedo, in 2026. Extreme thermal events are becoming more frequent, and the fleet's response - attraction, reduction or displacement - matters for coastal communities and fisheries management.
  dataSources:
    pt:
      - Esforço de pesca aparente por célula e mês (Global Fishing Watch, API 4Wings v3), 2013–2024
      - Temperatura da superfície do mar, NOAA OISST v2.1 (diária, 0,25°), 1991–2024, com climatologia 1991–2020
      - Malhas municipais e estaduais do IBGE (região costeira e linha de costa)
    en:
      - Apparent fishing effort by cell and month (Global Fishing Watch, 4Wings API v3), 2013–2024
      - Sea-surface temperature, NOAA OISST v2.1 (daily, 0.25°), 1991–2024, with a 1991–2020 climatology
      - IBGE municipal and state boundaries (coastal region and coastline)
  methods:
    pt:
      - Cubo de dados geoespacial célula-mês (grade H3, Parquet, pipeline targets)
      - Ondas de calor marinhas pela definição de Hobday et al. (2016), com definições alternativas como robustez
      - PPML com efeitos fixos de célula e período e sazonalidade regional, erros-padrão de Conley
      - Defasagens e antecipações (placebo), transbordamento espacial por anéis de vizinhança e permutação espacial
      - Heterogeneidade por arte de pesca e região; realocação em nível região-mês
    en:
      - Cell-month geospatial data cube (H3 grid, Parquet, targets pipeline)
      - Marine heatwaves under the Hobday et al. (2016) definition, with alternative definitions as robustness checks
      - PPML with cell and period fixed effects and regional seasonality, Conley standard errors
      - Lags and leads (placebo), spatial spillovers through neighbourhood rings and spatial permutation
      - Heterogeneity by gear and region; reallocation at the region-month level
  methodTags: [cubo-de-dados, painel, efeitos-fixos, ppml, analise-espacial, inferencia-causal]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Anomalias térmicas moderadas e eventos extremos podem produzir efeitos distintos sobre atração, redução ou deslocamento do esforço pesqueiro.
    en:
      - Moderate thermal anomalies and extreme events may produce distinct effects on the attraction, reduction or displacement of fishing effort.
  limitations:
    pt:
      - Resultados preliminares; não devem ser lidos como causalidade definitiva.
      - O esforço observado depende da cobertura do rastreamento por AIS, que varia no tempo; a frota artesanal é sub-representada.
      - O esforço de pesca "aparente" é inferência de modelo da Global Fishing Watch, não esforço declarado.
      - Produtividade oceânica, unidades de conservação e portos ficaram fora do cubo nesta versão.
    en:
      - Preliminary results; they should not be read as definitive causality.
      - Observed effort depends on AIS tracking coverage, which varies over time; the artisanal fleet is under-represented.
      - '"Apparent" fishing effort is a Global Fishing Watch model inference, not reported effort.'
      - Ocean productivity, marine protected areas and ports are outside the cube in this version.
  implications:
    pt:
      - Alertas e planejamento para comunidades costeiras e gestores pesqueiros diante de eventos térmicos.
    en:
      - Warnings and planning for coastal communities and fisheries managers facing thermal events.
  extensionProducts:
    pt:
      - Cubos de dados, painéis, mapas e boletins
      - Instrumentos para pescadores, comunidades costeiras, pesquisadores e gestores
    en:
      - Data cubes, dashboards, maps and bulletins
      - Tools for fishers, coastal communities, researchers and managers
  repository: https://github.com/valbergregory/marine-fisheries-data-cube
  repositoryVisibility: public
  languages: [R]
  outputTypes: [artigo, dados-abertos, painel-publico]
  codeAvailable: true
  dataAvailable: true
  featured: true
  featuredOrder: 6
  allowAutomaticMetadata: true
  lastEditorialReview: '2026-11-02'

- slug: fishing-closures-brazil
  title: "Do Fishing Closures Protect Fish or Displace Fishing? Causal Evidence from Brazil's Seasonal Bans and Marine Protected Areas"
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-pesqueira
  status: redacao
  summary:
    pt: Defesos e áreas marinhas protegidas reduzem a pressão pesqueira ou deslocam o esforço para áreas vizinhas? Avaliação causal com dados de rastreamento e uma base legal legível por máquina das normas de defeso.
    en: Do seasonal bans and marine protected areas reduce fishing pressure or displace effort to neighbouring areas? Causal evaluation with tracking data and a machine-readable knowledge base of closure regulations.
  researchQuestion:
    pt: Defesos e áreas marinhas protegidas reduzem a pressão pesqueira ou deslocam o esforço para áreas vizinhas?
    en: Do seasonal bans and marine protected areas reduce fishing pressure or displace effort to neighbouring areas?
  motivation:
    pt: O interesse por Economia Pesqueira foi fortalecido ao lecionar a disciplina para Engenharia de Pesca na UFAL, em Penedo, em 2026. Defesos e áreas protegidas são os principais instrumentos de gestão pesqueira no Brasil, mas raramente são avaliados com dados de esforço observado.
    en: Interest in fisheries economics grew while teaching the subject to Fisheries Engineering students at UFAL, Penedo, in 2026. Seasonal bans and protected areas are Brazil's main fisheries-management instruments, yet they are rarely evaluated with observed effort data.
  dataSources:
    pt:
      - Esforço de pesca por célula (Global Fishing Watch)
      - Corpus legal de normas de defeso e de áreas marinhas protegidas (26 normas), estruturado como base de conhecimento
      - Microdados do Seguro-Defeso (CGU, Portal da Transparência), agregados por município e mês
      - Temperatura da superfície do mar (NOAA OISST) e limites de unidades de conservação (ICMBio/INDE)
    en:
      - Fishing effort by cell (Global Fishing Watch)
      - Legal corpus of closure and marine-protected-area rules (26 regulations), structured as a knowledge base
      - Seguro-Defeso (closed-season benefit) microdata (CGU, Transparency Portal), aggregated by municipality and month
      - Sea-surface temperature (NOAA OISST) and conservation-unit boundaries (ICMBio/INDE)
  methods:
    pt:
      - Diferenças-em-diferenças espaciais, estudo de eventos e testes de placebo
      - Diferenças-em-diferenças sintéticas e PPML como especificações alternativas
      - Decomposição por embarcação para separar mudanças de cobertura de mudanças reais de atividade
    en:
      - Spatial difference-in-differences, event study and placebo tests
      - Synthetic difference-in-differences and PPML as alternative specifications
      - Vessel-level decomposition to separate coverage changes from real activity changes
  methodTags: [did, estudo-de-eventos, ppml, analise-espacial, inferencia-causal, cubo-de-dados]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - 'Contribuição metodológica: mudanças na cobertura de AIS e de outros sistemas de rastreamento podem ser confundidas com mudanças reais na atividade pesqueira; a avaliação precisa separar os dois.'
    en:
      - 'Methodological contribution: changes in AIS and other tracking coverage can be mistaken for real changes in fishing activity; evaluations must separate the two.'
  limitations:
    pt:
      - Parte dos casos (áreas protegidas oceânicas) ainda não permite identificação causal com os dados disponíveis.
      - O rastreamento por AIS cobre principalmente a frota industrial.
    en:
      - Some cases (oceanic protected areas) do not yet allow causal identification with the available data.
      - AIS tracking mainly covers the industrial fleet.
  implications:
    pt:
      - Desenho e monitoramento de defesos e áreas protegidas com base em esforço observado.
    en:
      - Design and monitoring of closures and protected areas based on observed effort.
  extensionProducts:
    pt:
      - Cubos de dados, painéis, mapas e boletins
      - Base de conhecimento pública das normas de defeso
      - Instrumentos para pescadores, comunidades costeiras, pesquisadores e gestores
    en:
      - Data cubes, dashboards, maps and bulletins
      - Public knowledge base of closure regulations
      - Tools for fishers, coastal communities, researchers and managers
