- slug: port-network-resilience
  title: 'Port Network Shocks and Regional Economic Resilience: Evidence from Maritime Disruptions and Brazilian Trade Networks'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-maritima-portos
  status: em-desenvolvimento
  summary:
    pt: Quando um porto sofre uma paralisação física, a rede de comércio consegue absorver o choque ou a atividade econômica regional diminui? O caso das enchentes no Rio Grande do Sul em 2024.
    en: When a port suffers a physical shutdown, can the trade network absorb the shock or does regional economic activity fall? The case of the 2024 floods in Rio Grande do Sul.
  researchQuestion:
    pt: Quando um porto sofre uma paralisação física, a rede de comércio consegue absorver o choque ou a atividade econômica regional diminui?
    en: When a port suffers a physical shutdown, can the trade network absorb the shock or does regional economic activity fall?
  motivation:
    pt: As enchentes de 2024 no Rio Grande do Sul interromperam operações portuárias em escala rara. O episódio permite observar como cargas, navios e municípios reagem a um choque exógeno sobre um nó da rede de comércio.
    en: The 2024 floods in Rio Grande do Sul interrupted port operations on a rare scale. The episode makes it possible to observe how cargo, ships and municipalities react to an exogenous shock on a node of the trade network.
  dataSources:
    pt:
      - Atracações e tempos de espera por porto (ANTAQ)
      - Exportações por município e porto de saída
    en:
      - Berthings and waiting times by port (ANTAQ)
      - Exports by municipality and port of exit
  methods:
    pt:
      - Estudos de eventos e diferenças-em-diferenças
      - Análise de redes de comércio e modelos PPML
    en:
      - Event studies and difference-in-differences
      - Trade-network analysis and PPML models
  methodTags: [estudo-de-eventos, did, redes, ppml]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Forte redução das atracações e aumento expressivo do tempo de espera nos portos atingidos.
      - Maior resiliência do valor agregado das exportações do que do volume físico.
      - Possível consolidação das cargas em menos embarcações.
      - Maior vulnerabilidade de municípios dependentes de um único porto.
    en:
      - Sharp reduction in berthings and a marked increase in waiting times at the affected ports.
      - Greater resilience of export value than of physical volume.
      - Possible consolidation of cargo into fewer vessels.
      - Greater vulnerability of municipalities that depend on a single port.
  limitations:
    pt:
      - Repositório privado; código e dados ainda não são públicos.
      - Resultados preliminares, sujeitos a revisão após novas validações.
    en:
      - Private repository; code and data are not yet public.
      - Preliminary results, subject to revision after further validation.
  implications:
    pt:
      - Planejamento de contingência logística e diversificação de portos de saída.
    en:
      - Logistics contingency planning and diversification of exit ports.
  extensionProducts:
    pt:
      - Indicadores de dependência portuária por município
    en:
      - Port-dependence indicators by municipality
  repository: null
  repositoryVisibility: private
  languages: [R, Python]
  outputTypes: [artigo]
  codeAvailable: false
  dataAvailable: false
  featured: true
  featuredOrder: 4
  allowAutomaticMetadata: false
  lastEditorialReview: '2026-09-11'

- slug: port-digitalization-observatory
  title: 'Digitalizing Port Processes: Design and Causal Evaluation of a Port Transformation Observatory'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
  track: economia-maritima-portos
  status: redacao
  summary:
    pt: O Porto Sem Papel reduziu tempos portuários e custos de comércio? Que transformação informacional foi produzida pela digitalização? Avaliação causal com dados da ANTAQ de 2010 a 2026 e um pipeline reproduzível de dados portuários.
    en: Did the Porto Sem Papel (paperless port) programme reduce port times and trade costs? What informational transformation did digitalisation produce? Causal evaluation with ANTAQ data from 2010 to 2026 and a reproducible port-data pipeline.
  researchQuestion:
    pt: O Porto Sem Papel reduziu tempos portuários e custos de comércio? Que transformação informacional foi produzida pela digitalização?
    en: Did the Porto Sem Papel programme reduce port times and trade costs? What informational transformation did digitalisation produce?
  motivation:
    pt: A digitalização portuária é apresentada como fonte de ganhos operacionais. Avaliar essa promessa com dados públicos e datas de adoção documentadas evita tanto o otimismo automático quanto a rejeição sem evidência.
    en: Port digitalisation is presented as a source of operational gains. Evaluating that promise with public data and documented adoption dates avoids both automatic optimism and evidence-free rejection.
  dataSources:
    pt:
      - Estatístico Aquaviário da ANTAQ (atracações, tempos de atracação e carga), 2010–2026
      - 'Comex Stat (MDIC/SECEX): exportações e importações por NCM e unidade da Receita (URF), 2010–2026'
      - Datas de adoção do Porto Sem Papel por porto, lidas nas portarias da SEP publicadas no Diário Oficial da União
      - Malha estadual do IBGE (2024), usada apenas nos mapas
    en:
      - ANTAQ Estatístico Aquaviário (vessel calls, berth times and cargo), 2010–2026
      - 'Comex Stat (MDIC/SECEX): exports and imports by NCM and customs unit (URF), 2010–2026'
      - Porto Sem Papel adoption dates by port, read from SEP ordinances published in the Official Gazette
      - IBGE state boundaries (2024), used only for maps
  methods:
    pt:
      - Diferenças-em-diferenças escalonadas e estudos de eventos (Sun–Abraham) por atracação
      - Inferência com poucos clusters (wild cluster bootstrap e permutação de datas)
      - Sensibilidade a pré-tendências (HonestDiD) e limites de Lee
      - Fronteira estocástica e DEA de eficiência portuária
      - Modelos PPML para comércio e fretes
    en:
      - Staggered difference-in-differences and event studies (Sun–Abraham) at the vessel-call level
      - Few-cluster inference (wild cluster bootstrap and date permutation)
      - Pre-trend sensitivity (HonestDiD) and Lee bounds
      - Stochastic frontier and DEA of port efficiency
      - PPML models for trade and freight
  methodTags: [did, estudo-de-eventos, sfa, ppml, painel, text-mining]
  showPreliminaryFindings: true
  preliminaryFindings:
    pt:
      - Os resultados preliminares não indicam redução operacional generalizada dos tempos portuários após a digitalização.
      - A principal contribuição identificada pode estar na ampliação da cobertura e da governança dos dados portuários.
    en:
      - Preliminary results do not indicate a generalised operational reduction in port times after digitalisation.
      - The main contribution identified may lie in the expansion of coverage and governance of port data.
  limitations:
    pt:
      - Resultados preliminares; a redação do manuscrito está em andamento.
      - Datas de adoção dependem de registros oficiais que podem não coincidir com o uso efetivo.
      - Portarias de parte dos portos ainda não localizadas no DOU (pedido de acesso à informação em curso).
      - A decomposição dos tempos documentais (T2/T4) é informada de forma incompleta pelos portos, com cobertura variável por ano.
    en:
      - Preliminary results; the manuscript is being written.
      - Adoption dates depend on official records that may not coincide with effective use.
      - Ordinances for some ports have not yet been located in the Official Gazette (access-to-information request pending).
      - The documentary time decomposition (T2/T4) is incompletely reported by ports, with coverage varying by year.
  implications:
    pt:
      - Instrumentos de avaliação de governo digital baseados em dados administrativos.
    en:
      - Digital-government evaluation instruments based on administrative data.
  extensionProducts:
    pt:
      - Painéis, séries históricas e mapas sobre a digitalização portuária
      - Documentação de políticas e instrumentos de avaliação de governo digital
    en:
      - Dashboards, historical series and maps on port digitalisation
      - Policy documentation and digital-government evaluation instruments
  repository: https://github.com/valbergregory/Port-Digitalization-Observatory
  repositoryVisibility: public
  languages: [R, SQL, Python]
