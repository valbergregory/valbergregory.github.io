- slug: adocao-ia-judiciario-seguranca
  title: 'Adoção de IA no Poder Judiciário Brasileiro sem Controles de Segurança: Um Estudo Comparativo dos 27 Tribunais de Justiça Estaduais'
  authors:
    - Valber Gregory Barbosa Costa Bezerra Santos
    - Gustavo Henrique Ferreira de Miranda Oliveira
    - Jário José dos Santos Júnior
  track: ia-governo-digital-seguranca
  status: redacao
  summary:
    pt: Os Tribunais de Justiça estão adotando IA na mesma velocidade em que desenvolvem controles de segurança, governança, proteção de dados e resposta a incidentes? Levantamento documental comparativo dos 27 tribunais estaduais, com dados de replicação públicos.
    en: Are Brazilian state courts adopting AI at the same pace at which they develop security, governance, data-protection and incident-response controls? Comparative document survey of the 27 state courts, with public replication data.
  researchQuestion:
    pt: Os Tribunais de Justiça estão adotando IA na mesma velocidade em que desenvolvem controles de segurança, governança, proteção de dados e resposta a incidentes?
    en: Are the state courts adopting AI at the same pace at which they develop security, governance, data-protection and incident-response controls?
  motivation:
    pt: Sistemas de IA no Judiciário lidam com dados sensíveis e decisões que afetam direitos. A pesquisa verifica, tribunal a tribunal, se a adoção veio acompanhada de estruturas mínimas de governança e segurança.
    en: AI systems in the judiciary handle sensitive data and decisions that affect rights. The study checks, court by court, whether adoption came with minimum governance and security structures.
  dataSources:
    pt:
      - Portais oficiais e Diários de Justiça Eletrônicos dos 27 Tribunais de Justiça, janeiro de 2021 a junho de 2026
      - Matriz de replicação publicada com licença CC BY 4.0
    en:
      - Official portals and Electronic Court Gazettes of the 27 state courts, January 2021 to June 2026
      - Replication matrix published under a CC BY 4.0 licence
  methods:
    pt:
      - 'Análise documental comparativa em seis dimensões: governança de dados; política de segurança da informação; encarregado de proteção de dados; relatório de impacto; resposta a incidentes; regulamentação de IA'
      - Matriz ponderada de prontidão com quatro níveis de maturidade (Inicial, Básico, Intermediário, Avançado)
      - Leitura do OWASP LLM Top 10 (2025) no contexto judicial, com tática MITRE ATT&CK, controle DevSecOps e artigo da LGPD
    en:
      - 'Comparative document analysis across six dimensions: data governance; information-security policy; data-protection officer; impact assessment; incident response; AI regulation'
      - Weighted readiness matrix with four maturity levels (Initial, Basic, Intermediate, Advanced)
      - OWASP LLM Top 10 (2025) read in the judicial context, with MITRE ATT&CK tactic, DevSecOps control and LGPD article
  methodTags: [analise-documental]
  showPreliminaryFindings: false
  limitations:
    pt:
      - A análise avalia conformidade formal publicada, não implementação técnica verificada em campo; a ausência de evidência pública é registrada como tal.
      - A análise capta a existência de normas públicas, não a sua efetividade.
    en:
      - The analysis assesses published formal compliance, not field-verified technical implementation; absence of public evidence is recorded as such.
      - The analysis captures the existence of public rules, not their effectiveness.
  implications:
    pt:
      - Parâmetros para políticas de segurança e governança de IA no Judiciário.
    en:
      - Parameters for AI security and governance policies in the judiciary.
  extensionProducts:
    pt:
