  track: economia-politicas-publicas
  status: pre-submissao
  summary:
    pt: Quanto o gasto público em educação retorna em produto, salários e arrecadação ao longo do tempo? O trabalho combina evidências em painel para o Brasil com um modelo DSGE fiscal em que a educação forma capital humano.
    en: How much does public spending on education return in output, wages and tax revenue over time? The paper combines panel evidence for Brazil with a fiscal DSGE model in which education builds human capital.
  researchQuestion:
    pt: Quanto o gasto público em educação retorna em produto, salários e arrecadação ao longo do tempo?
    en: How much does public spending on education return in output, wages and tax revenue over time?
  motivation:
    pt: Cortes em educação costumam ser defendidos como ajuste fiscal imediato, mas o gasto educacional forma capital humano que eleva salários e a base tributária no futuro. Medir esse retorno dinâmico ajuda a avaliar se a austeridade educacional se paga ou se custa mais do que economiza.
    en: Education cuts are often defended as immediate fiscal adjustment, yet education spending builds human capital that raises wages and the tax base in the future. Measuring this dynamic return helps assess whether educational austerity pays for itself or costs more than it saves.
  dataSources:
    pt:
      - Dados em painel de unidades subnacionais brasileiras (gasto em educação, salários regionais e arrecadação)
      - Parâmetros calibrados para a economia brasileira no modelo DSGE
    en:
      - Panel data for Brazilian subnational units (education spending, regional wages and tax revenue)
      - Parameters calibrated to the Brazilian economy in the DSGE model
  methods:
    pt:
      - Econometria de dados em painel
      - Modelo DSGE fiscal com capital humano e simulação de choques de gasto
    en:
      - Panel-data econometrics
      - Fiscal DSGE model with human capital and simulation of spending shocks
  methodTags: [painel, dsge, efeitos-fixos]
  showPreliminaryFindings: false
  limitations:
