# Bio em cinco idiomas. Cada bloco é usado com o atributo lang correspondente.
bio:
  pt:
    lang: pt-BR
    label: Português
    paragraphs:
      - >-
        Sou professor da Universidade Federal de Alagoas, na Unidade Educacional Penedo, economista
        registrado no CORECON/AL e Analista Judiciário, área de Economia, no Tribunal de Justiça de Alagoas,
        onde também atuo como assessor judicial. Tenho formação em Direito e em Economia, com mestrado em
        Economia Aplicada (UFAL) e doutorado em Economia (UFPB).
      - >-
        Minha pesquisa fica na interface entre Economia, Direito, Sistemas de Informação e Administração
        Pública. Estudo políticas públicas, Jurimetria, adoção de inteligência artificial e transformação
        digital no setor público, economia do turismo, economia marítima e economia pesqueira — sempre com
        dados públicos, métodos reproduzíveis e a preocupação de que os resultados voltem para a sala de
        aula, para a extensão e para quem toma decisões.
  en:
    lang: en
    label: English
    paragraphs:
      - >-
        I am a professor at the Federal University of Alagoas (UFAL), Penedo Educational Unit, a registered
        economist (CORECON/AL) and a Judicial Analyst in Economics at the Alagoas State Court of Justice
        (TJAL), where I also serve as a judicial adviser. I hold degrees in Law and in Economics, a master's
        degree in Applied Economics (UFAL) and a PhD in Economics (UFPB).
      - >-
        My research sits at the interface between Economics, Law, Information Systems and Public
        Administration. I study public policy, jurimetrics, the adoption of artificial intelligence and
        digital transformation in the public sector, tourism economics, maritime economics and fisheries
        economics — always with public data, reproducible methods and the aim of bringing results back to
        the classroom, to outreach work and to decision-makers.
  fr:
    lang: fr
    label: Français
    paragraphs:
      - >-
        Je suis professeur à l'Université fédérale d'Alagoas (UFAL), unité d'enseignement de Penedo,
        économiste inscrit au CORECON/AL et analyste judiciaire en économie au Tribunal de justice de
        l'État d'Alagoas (TJAL), où j'exerce également comme conseiller judiciaire. Formé en droit et en
        économie, je suis titulaire d'un master en économie appliquée (UFAL) et d'un doctorat en économie
        (UFPB).
      - >-
        Mes recherches se situent à l'interface entre l'économie, le droit, les systèmes d'information et
        l'administration publique. J'étudie les politiques publiques, la jurimétrie, l'adoption de
        l'intelligence artificielle et la transformation numérique dans le secteur public, l'économie du
        tourisme, l'économie maritime et l'économie des pêches — toujours à partir de données publiques,
        avec des méthodes reproductibles et le souci que les résultats reviennent vers la salle de classe,
        les actions de vulgarisation et les décideurs.
  de:
    lang: de
    label: Deutsch
    paragraphs:
      - >-
        Ich bin Professor an der Bundesuniversität von Alagoas (UFAL) am Standort Penedo, beim CORECON/AL
        registrierter Volkswirt und Justizanalyst für Wirtschaft am Gerichtshof des Bundesstaates Alagoas
        (TJAL), wo ich außerdem als Justizreferent tätig bin. Ich habe Rechtswissenschaft und
        Volkswirtschaftslehre studiert, einen Master in angewandter Volkswirtschaftslehre (UFAL) und einen
        Doktortitel in Volkswirtschaftslehre (UFPB) erworben.
      - >-
        Meine Forschung bewegt sich an der Schnittstelle von Volkswirtschaftslehre, Recht,
        Informationssystemen und öffentlicher Verwaltung. Ich untersuche öffentliche Politik, Jurimetrie,
        den Einsatz künstlicher Intelligenz und die digitale Transformation im öffentlichen Sektor,
        Tourismusökonomie, maritime Ökonomie und Fischereiökonomie — stets mit öffentlichen Daten,
        reproduzierbaren Methoden und dem Anspruch, dass die Ergebnisse in die Lehre, in den
        Wissenstransfer und zu den Entscheidungsträgern zurückfließen.
  it:
    lang: it
    label: Italiano
    paragraphs:
      - >-
        Sono professore all'Università Federale di Alagoas (UFAL), unità didattica di Penedo, economista
        iscritto al CORECON/AL e analista giudiziario in economia presso il Tribunale di Giustizia dello
        Stato di Alagoas (TJAL), dove lavoro anche come assessore giudiziario. Ho una formazione in
        Giurisprudenza e in Economia, con un master in Economia Applicata (UFAL) e un dottorato in
        Economia (UFPB).
      - >-
        La mia ricerca si colloca all'interfaccia tra Economia, Diritto, Sistemi Informativi e Pubblica
        Amministrazione. Studio le politiche pubbliche, la giurimetria, l'adozione dell'intelligenza
        artificiale e la trasformazione digitale nel settore pubblico, l'economia del turismo, l'economia
        marittima e l'economia della pesca — sempre con dati pubblici, metodi riproducibili e l'obiettivo
        che i risultati tornino in aula, nelle attività di terza missione e a chi prende le decisioni.

# Aprovações em concursos públicos (informadas pelo titular em 12/09/2026; conferem com o Lattes).
publicExamsIntro:
  pt: >-
    Os concursos públicos fazem parte da minha trajetória, tanto como candidato quanto como servidor.
    Fui aprovado em oito seleções para os cargos de economista, professor, analista judiciário e
    procurador municipal, três delas em primeiro lugar, além de ter sido habilitado no Exame Nacional
    da Magistratura (ENAM). Ainda participo de concursos públicos e acompanho editais, bancas
    examinadoras e a estruturação das carreiras, mantendo vivo meu interesse por avaliação, gestão e
    políticas de pessoal no setor público.
  en: >-
    Public service examinations (concursos públicos) are part of my trajectory, both as a candidate
    and as a civil servant. I passed eight competitive selections for economist, professor, judicial
    analyst and municipal attorney positions, three of them in first place, and I was also certified
    in the National Judiciary Examination (ENAM). I still sit public examinations and follow calls,
    examination boards and the structuring of public careers, which keeps alive my interest in
    evaluation, management and personnel policy in the public sector.
