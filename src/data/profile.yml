# Linhas de pesquisa exibidas na página inicial (a sexta é transversal).
researchLines:
  - key: economia-politicas-publicas
    label:
      pt: Economia e políticas públicas
      en: Economics and public policy
    blurb:
      pt: Gasto público, educação, preços agrícolas e avaliação de políticas com dados em painel e séries temporais.
      en: Public spending, education, agricultural prices and policy evaluation with panel and time-series data.
  - key: economia-direito-jurimetria
    label:
      pt: Economia do Direito e Jurimetria
      en: Law and Economics and Jurimetrics
    blurb:
      pt: Decisões judiciais como dados — danos morais, duração dos processos, precedentes e litigância.
      en: Court decisions as data — moral damages, case duration, precedents and litigation patterns.
  - key: ia-governo-digital-seguranca
    label:
      pt: IA, governo digital e segurança
      en: AI, digital government and security
    blurb:
      pt: Adoção de inteligência artificial no setor público, produtividade, governança e controles de segurança.
      en: AI adoption in the public sector, productivity, governance and security controls.
  - key: economia-turismo
    label:
      pt: Economia do Turismo
      en: Tourism Economics
    blurb:
      pt: Demanda internacional, conectividade, competitividade de preços e desenvolvimento territorial.
      en: International demand, connectivity, price competitiveness and territorial development.
  - key: economia-maritima-portos
    label:
      pt: Economia Marítima e Portos
      en: Maritime Economics and Ports
    blurb:
      pt: Choques portuários, resiliência regional e digitalização dos processos portuários.
      en: Port shocks, regional resilience and the digitalisation of port processes.
  - key: economia-pesqueira
    label:
      pt: Economia Pesqueira
      en: Fisheries Economics
    blurb:
      pt: Ondas de calor marinhas, esforço pesqueiro, defesos e áreas marinhas protegidas.
      en: Marine heatwaves, fishing effort, seasonal closures and marine protected areas.
  - key: dados-econometria-si
    label:
      pt: Dados, econometria e Sistemas de Informação
      en: Data, econometrics and Information Systems
    blurb:
      pt: Linha transversal — R, Python, SQL, análise espacial, pipelines reproduzíveis e sistemas de apoio à decisão.
      en: Cross-cutting line — R, Python, SQL, spatial analysis, reproducible pipelines and decision-support systems.
    transversal: true

tools:
