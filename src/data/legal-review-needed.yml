  publicFallback: '"Professor do Magistério Superior" (sem classe/nível) em profile.yml, currículo e PDF.'
  requiredEvidence: Portaria de progressão/promoção vigente ou consulta ao assentamento funcional.
  ownerAction: 'Classe/nível atuais informados pelo titular em 14/09/2026 (manifesto privado), com mudança de classe prevista pela reestruturação da carreira (Lei 15.141/2025); o site mantém a denominação neutra "Professor do Magistério Superior" até a portaria da nova classe.'
  status: pending
  lastReviewed: 2026-09-14

