  ownerAction: Obter e arquivar as autorizações; então marcar consentVerified true em images.yml e restaurar a imagem em TeachingPage.astro. Alternativa - recortar o mosaico para os painéis só com o titular.
  status: pending
  lastReviewed: 2026-09-13

