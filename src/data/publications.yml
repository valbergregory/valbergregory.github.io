  language: pt
  track: economia-politicas-publicas
  note:
    pt: Texto completo hospedado pelo evento (Governança de Terras). Analisa os ganhos dos municípios alagoanos que optaram pela cobrança integral do ITR entre 2008 e 2012.
    en: Full text hosted by the event (Governança de Terras). Analyses the gains of Alagoas municipalities that opted to collect the rural land tax (ITR) in full between 2008 and 2012.

