# Atualizações de dependências em pull requests; o workflow ci.yml valida cada uma.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Maceio
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 6+ ainda não é aceito pelos peers de @astrojs/check e typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', 'typescript*', 'prettier*', 'vitest', '@astrojs/check']
      fonts:
        patterns: ['@fontsource-variable/*']
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
